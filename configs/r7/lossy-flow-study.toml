schema = "r7-lossy-flow-study-v1"
origin = "synthetic"
normal_input = "configs/r7/normal-reserve-hand.toml"
planning_input = "configs/r7/planning-reserve-hand.toml"
budget_sec = 600.0
record_count = 24
groups = ["healthy_zero_loss", "all_faults_heat_limit", "all_faults_zero_loss"]
controls = ["prescribed", "recovery_continuous", "joint_continuous"]
UA_values_W_K = [0.0, 10.0]
UA_rule = "each supply and return pipe has the same declared whole-pipe UA; topology, capacity and initial temperatures unchanged"
positive_floor_kg_s = 0.05
heat_loss_limit_MWh = 0.4
substeps = 1
quadrature_order = 10
max_truncation_error = 1e-10
battery_rule = "per_period_exclusive_v1"
primary_solver = "Gurobi"
fixed_reference_solver = "HiGHS"
bound_scope = "adopted_gauss_model_not_exact_PDE"
node_rule = "time/substep-average zero-volume mixing"
terminal_rule = "original normal pipe inventory cycle; no disaster terminal cycle"
no_initial_solution_injection = true
freeze_note = "Declared after kernel and integration development, before these 24 formal runs; no result-driven change of capacities or temperatures."
