schema = "r7-flow-planning-study-v1"
origin = "synthetic"
normal_input = "configs/r7/normal-reserve-hand.toml"
planning_input = "configs/r7/planning-reserve-hand.toml"
budget_sec = 600.0
record_count = 12
groups = ["healthy_zero_loss", "all_faults_heat_limit", "all_faults_zero_loss"]
controls = ["prescribed", "recovery_continuous", "joint_continuous"]
positive_floor_kg_s = 0.05
normal_upper_rule = "original pipe and active port capacity"
recovery_lower_kg_s = 0.0
recovery_upper_rule = "original pipe and port capacity, identical for all faults"
prescribed_recovery_rule = "healthy internal line: 5 kg/s; failed internal line: 0 kg/s; source node 1 and load node 2"
heat_loss_limit_MWh = 0.4
substeps = 1
primary_solver = "Gurobi"
fixed_reference_solver = "HiGHS"
battery_rule = "retain original input rule; report nonsimultaneous check separately"
node_rule = "time/substep-average zero-volume mixing"
thermal_rule = "zero UA, shared complete normal spatial history"
terminal_rule = "original normal pipe inventory cycle; no new disaster terminal cycle"
scope = "three safety boundaries; compare controls only within identical boundary and input"
no_initial_solution_injection = true
freeze_note = "Declared after development tests, before these twelve formal optimizations; development is not held-out validation."
