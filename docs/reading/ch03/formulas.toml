[groups.dispatch]
source = "src/formulations/r2.jl"
api = "build_r2_model"
test = "R2 saved integration ch03-001:057"
symbols = ["indices", "P_device", "H_device", "P_grid", "cost", "ratio", "bounds", "P_demand", "Q_demand"]
assumptions = "合成案例采用常热电比/常COP、设备单位功率因数、显式购电边界；空GT集合允许。MW×h计费。"

[groups.operation]
source = "src/core/r3_operation.jl"
api = "R3OperationSpec"
test = "R3 four operation modes and local candidate"
test_path = "test/r3_v2.jl"
symbols = ["indices", "alg_m", "bounds", "mode_flow", "mode_temperature"]
assumptions = "PDF58四模式原定义；项目冻结恒定参考流量，只固定热源供水端口温度。新输入使用有界负荷回水和共同恢复尾段。"

[groups.algorithm]
source = "src/formulations/r3.jl"
api = "build_r3_subproblem"
test = "R3 fixed schedule and reconstruction ch03-060"
test_path = "test/r3.jl"
symbols = ["alg_x", "alg_m", "alg_theta", "alg_s", "alg_lambda", "alg_mu", "alg_gamma"]
assumptions = "PDF52–55算法抽象；固定流量SP与项目弹性诊断可运行。直接修正和核查版投影梯度分别记录，不将局部半空间当全局有效割。"
[groups.gradient]
source = "src/algorithms/r3_sensitivity.jl"
api = "r3_value_sensitivity"
test = "R3 dual signs and complete value sensitivity"
test_path = "test/r3_pg.jl"
symbols = ["alg_x", "alg_m", "alg_theta", "alg_lambda", "alg_mu"]
assumptions = "采用式补足全部流量相关项；仅连续凸子问题可信对偶，WMM分段导数与有限差分对照。"
[groups.projection]
source = "src/algorithms/r3_projection.jl"
api = "build_r3_projection"
test = "R3 convex projection and outer trace"
test_path = "test/r3_pg.jl"
symbols = ["alg_x", "alg_m", "alg_gamma"]
assumptions = "主问题采用凸外松弛域，辅助调度变量共同优化；项目使用流量跨度归一化距离，原式为未缩放距离。"
[groups.pg]
source = "src/algorithms/r3_pg.jl"
api = "solve_r3_projected_gradient"
test = "R3 convex projection and outer trace"
test_path = "test/r3_pg.jl"
symbols = ["alg_x", "alg_m", "alg_theta", "alg_s", "alg_lambda", "alg_mu", "alg_gamma"]
assumptions = "r3_pg_checked_v1；尺度、回溯、单侧试探和停止条件为项目补全，不继承参考文献的全局收敛证明。"
[groups.electric]
source = "src/formulations/r2.jl"
api = "build_r2_model"
test = "R2 saved integration ch03-001:057"
symbols = ["indices", "P_branch", "Q_branch", "v", "ell", "impedance", "P_device", "P_demand", "Q_demand", "P_net", "Q_net", "bounds"]
assumptions = "固定有向径向树；根电压1pu；保留3-12锥松弛，原支路等式独立回代。"
[groups.hydraulic]
source = "src/formulations/r2.jl"
api = "build_r2_model"
test = "R2 saved integration ch03-001:057"
symbols = ["indices", "H_net", "m_port", "m_pipe", "delta_tau", "tau_port", "cp", "Phi", "kappa", "mu", "bounds", "H_device", "H_demand"]
assumptions = "首批管内严格正向；端口用正幅值和source/load角色补全原式方向；3-25仅回代，构建使用3-26。"
[groups.wmm]
source = "src/formulations/r2.jl"
api = "build_r2_model"
test = "R2 transport ch03-027:034"
symbols = ["indices", "m_pipe", "alpha", "beta", "Td", "dt", "rho", "area", "length", "tau_pipe", "tau_star", "tau_ambient", "epsilon", "cp"]
assumptions = "历史输入显式；逐段水质量恒定；原3-34保留转录，checked版采用负指数和beta从滞后1开始的版本。"
[groups.mixing]
source = "src/formulations/r2.jl"
api = "build_r2_model"
test = "R2 saved integration ch03-001:057"
symbols = ["indices", "m_pipe", "m_port", "tau_pipe", "tau_mix", "tau_port", "bounds"]
assumptions = "按实际供回水方向确定入流，热源注入供水、负荷注入回水；不能将负的净注入直接当混合权重。"
[groups.simplified]
source = "src/formulations/r2.jl"
api = "build_r2_model"
test = "R2 envelopes and literal counterexamples ch03-042:052"
