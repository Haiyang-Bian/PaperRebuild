[[issue]]
id = "R4-D-C01"
topic = "同一拉格朗日的方向和系数"
adopted = "统一r=x-z，AG线性项+λx、DSO线性项-λz，二次项ρ/2。原式β与β²及4-64的HN上标不直接执行。"
[[issue]]
id = "R4-D-C02"
topic = "ADMM辅助量与乘子"
adopted = "平方罚项导出反对称投影；未缩放λ对应差项须除ρ，u=λ/ρ后无需再除。原文步骤2.a.b把辅助量更新称为乘子更新，另补真正的u递推。"
[[issue]]
id = "R4-D-C03"
topic = "不足的边界通信"
adopted = "当前Q_D随可调P_D变化，热端口包络依赖H_src/H_D；增加这些边界量，不向DSO回传全部AG设备控制。程序保存全体结果用于离线独立审计，不宣称访问控制或密码学隐私。"
[[issue]]
id = "R4-D-C04"
topic = "凸性和有限精度"
adopted = "固定离散模式及SOCP；实际MOI类型核查。固定ρ及有限内层容差是项目约定；不继承整数/非凸全局收敛，也不以A4代替物理A1。"
[[issue]]
id = "R4-D-C05"
topic = "福利与合同的不同作用"
adopted = "SWM内部支付抵消，有限但足够宽零售通道使零P2P合同可嵌入所有物理计划；双边交易可能不唯一。AGNB另计零售与卖方一次费用，单独检验非零合同求解。"
