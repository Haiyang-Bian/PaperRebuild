[[issue]]
id="R4-NC01"
original="4-29用u而文字u=1为闭合。"
evidence="断开u=0且P=Q=ell=0时原式强制两侧电压相等；闭合反允许电压降松弛。"
adopted="改用(1-u)，独立N2；旧原式与历史结果保留。"
[[issue]]
id="R4-NC02"
original="4-35/36、4-49/50的索引约定有冲突；仅父数上界不能保证连通。"
evidence="根孤立，其余三个节点形成环时仍可满足每节点最多一个父节点。"
adopted="显式N1；全节点连通是本批建模边界。"
[[issue]]
id="R4-NC03"
original="4-38/39对闭合状态u求和，4-40却用方向z表达动作。"
evidence="d=2、持续闭合u=1且无动作a=0会产生2<=1反例。方向变化也不必是物理开关动作。"
adopted="按文字动作意图建立N3；动作间隔2步、每线最多2次为冻结项目参数。"
[[issue]]
id="R4-NC04"
original="4-47/48、PDF67文字给整日热阀门；能量流允许带符号，固定损耗须随实际方向处理。"
evidence="直接把负的Hin/Hout代入正损耗式会颠倒输入/输出能量。"
adopted="N4正反弧互斥，虚拟连通与实际热方向分离；非完整热水力模型。"
[[issue]]
id="R4-NC05"
original="4-33原页锥中为v_n,t；原4-27与支路发送端电流平方关系采用v_m,t。"
evidence="PDF66视觉复核；既有台账此前已用发送端规范化，但未单独注明这个下标差异。"
adopted="保留发送端采用式与旧结果；另记原页差异，不静默更改物理实现。"
