[[equation]]
id = "R4-N1"
title = "全节点连通树"
latex = '\sum_e u_{e,t}=|N|-1,\quad -( |N|-1)u_{e,t}\le F_{e,t}\le(|N|-1)u_{e,t},\quad \sum_{\delta^+(i)}F-\sum_{\delta^-(i)}F=\begin{cases}|N|-1&i=1\\-1&i\ne1\end{cases}'
api = "build_r4_reconfiguration"
test = "R4 network reconfiguration"
interpretation = "项目采用单根、全节点连通；不是孤岛供能模型。虚拟流不等于物理方向。"
[[equation]]
id = "R4-N2"
title = "电开路与电压降"
latex = '|v_j-v_i+2(rP+xQ)-(r^2+x^2)\ell|\le(v_{\max}-v_{\min})(1-u^E),\quad |P|\le P^{\max}u^E,\quad |Q|\le Q^{\max}u^E,\quad0\le\ell\le\ell^{\max}u^E'
api = "build_r4_reconfiguration"
test = "R4 network reconfiguration"
interpretation = "此处v_min/v_max为电压平方边界。断开时P/Q/ell为零，因此M等于平方电压跨度足够。"
[[equation]]
id = "R4-N3"
title = "动作与稳定窗口"
latex = 'a^E_{e,t}=|u^E_{e,t}-u^E_{e,t-1}|,\quad \sum_{k=\max(1,t-d+1)}^t a^E_{e,k}\le1,\quad\sum_ta^E_{e,t}\le A_e^{\max}'
api = "validate_r4_reconfiguration"
test = "R4 network reconfiguration"
interpretation = "用四个线性不等式精确实现二元异或；初始此前d-1步稳定，尾端不加周期恢复。"
[[equation]]
id = "R4-N4"
title = "日阀门与逐时热方向"
latex = 'd^+_{p,t}+d^-_{p,t}=u^H_p,\quad 0\le(m,H^{in},H^{out})^\pm\le(M,H^{\max},H^{\max})d^\pm,\quad H^{out,\pm}=H^{in,\pm}-L_p d^\pm'
api = "build_r4_reconfiguration"
test = "R4 network reconfiguration"
interpretation = "每条物理管道只在一个方向计损耗；反向弧交换端点，实际能量和质量均非负。L来自既有SI冻结损耗。"
[[equation]]
id = "R4-N5"
title = "资源与动作成本"
latex = 'C=C_{\rm resource}+C_{\rm grid}+C_{\rm discomfort}+c^{SA}\sum_{e,t}a^E_{e,t}+c^{VA}\sum_p|u^H_p-u^H_{p,0}|'
api = "solve_r4_reconfiguration"
test = "R4 network reconfiguration"
interpretation = "动作按美元/次，无额外Δt；由运营商承担，内部支付仍抵消。不是新收费转移带来的收益。"
[[equation]]
id = "R4-N6"
title = "有限枚举参照"
latex = 'C^*=\min_{z\in\mathcal Z}C_z^*,\qquad L=\min_{z\in\mathcal Z}L_z,\qquad U=\min_{z\in\mathcal Z_{\rm feasible}} C_z'
api = "enumerate_r4_reconfiguration"
test = "R4 network reconfiguration"
interpretation = "仅全部状态均有有效界或不可行证明时给并集证书。当前单时段为3电树×3热树×4热方向×2电池模式。"

