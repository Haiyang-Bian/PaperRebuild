meaning = "不满意度上图等价缩放，费用变量为合成美元每小时"
formula = '(w,1/2,sqrt(a)*(D_preferred-D)) in rotated_cone; C_sat=dt*w'
api = "build_r4_model"
source = "src/formulations/r4.jl"
test = "R4 fixed preference and implementable baseline"
status = "implemented"

[[equation]]
