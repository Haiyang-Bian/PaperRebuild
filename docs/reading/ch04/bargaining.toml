[[issue]]
id = "R4-N01"
topic = "解析分配适用条件"
adopted = "正权重、正总剩余、无限额预算平衡转移；零剩余退化，负剩余拒绝个体理性成功。固定调度分配不认证上游全局最优。"
[[issue]]
id = "R4-N02"
topic = "市场力到容量键的映射"
adopted = "原文PDF72未逐设备定义容量汇总；项目只计CHP/PV电功率、HP/EB输入功率、电池功率及参考电热峰荷。运营商权重等于聚合商之和。等权是独立对照。"
[[issue]]
id = "R4-N03"
topic = "TSPA分歧点与稳定性边界"
adopted = "PDF73的AGNB忽略网络，再以DHSO0-r松弛网络并加罚。PDF74从SW_coordinated>=SW_P2P推出(4-102)，但松弛分歧点不自动属于协调物理可行域；须核对罚项、可行域和总增益。本批未实现TSPA，不宣称所有子联盟稳定。"
[[issue]]
id = "R4-N04"
topic = "ATC/ADMM待核对"
adopted = "PDF68-69的beta与beta平方、ADMM范数是否平方、辅助贸易更新是否缺rho以及对偶更新须逐项推导。本批不实现分布协调。"
