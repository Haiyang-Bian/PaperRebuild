[[symbol]]
id = "hc_port_temperatures"
latex = 'S_i^{src},R_i^{load}'
julia = "τ_source / τ_load"
meaning = "源出口与荷出口温度；节点×时间；ASCII别名source/load"
unit = "K"
[[symbol]]
id = "hc_pipe_temperatures"
latex = 'S_{ij}^{out},R_{ij}^{out}'
julia = "τ_S_out / τ_R_out"
