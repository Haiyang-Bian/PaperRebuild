unit = "K"
[[symbol]]
id = "hc_frozen_losses"
latex = '\widehat L_{ij}^{S},\widehat L_{ij}^{R}'
julia = "Ls / Lr"
meaning = "父输入参考温度、U和长度计算的冻结损耗；关闭管道为零"
unit = "MW"

[[issue]]
id = "R4-HC-C01"
statement = "父模型未把每管H与m、温度关联；20运行59处近零m正H。保存状态不相容不等于同控制不可重构。"
decision = "新增独立核查，旧模型/原判定不改。"
[[issue]]
id = "R4-HC-C02"
statement = "第4章指向文献[26]，原参考文献确为Khatibi等2021接受稿；尚未得到逐管方程等价证据。"
decision = "本批HC方程作为守恒推导的项目核查，不冒称恢复了作者未公开实现。"
[[issue]]
id = "R4-HC-C03"
statement = "父输入只有参考绝对温度和端口温差上下界，缺少完整节点/管道绝对温度带。"
decision = "实验前冻结参考±10K和±20K两带；带内失败不推论全温区不可行。"
[[issue]]
id = "R4-HC-C04"
statement = "固定损耗与真实温变散热不同；无压力、泵、时延及开关瞬态。"
decision = "通过只认证声明的稳态热相容性，不称完整热物理成功。"
[[issue]]
id = "R4-HC-C05"
statement = "父保存浮点数的守恒残差不为严格零；精确冻结所有等式可能造成数值矛盾。"
decision = "匹配热交付/固定流量时用原A1的十分之一带宽，独立门槛仍为原A1；保存最大残差。"
