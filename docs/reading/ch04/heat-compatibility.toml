version = "r4_heat_compatibility_v1"
scope = "Frozen controls/heat/topology, stationary supply-return mixing, frozen reference losses. No hydraulics/dynamics/exact temperature-dependent heat transfer."
source_pages = [66, 67, 148, 149]
reference_26 = "https://vbn.aau.dk/ws/portalfiles/portal/433818534/Exploiting_Power_to_Heat_Assets_in_District_Heating_Networks_to_Regulate_Electric_Power_Network.pdf"
reference_status = "Bibliographic identity visually confirmed on thesis PDF149. Accepted-manuscript text retrieved; exact mapping to thesis 4-41--4-47 remains unverified. Screenshot retrieval failed; no claim of full visual audit of the accepted manuscript."

[[equation]]
id = "R4-HC1"
latex = 'H_{ij}^{in}=c\,m_{ij}(S_i-R_{ij}^{out}),\qquad H_{ij}^{out}=c\,m_{ij}(S_{ij}^{out}-R_j)'
meaning = "两根供回水管作为一对；入口与出口指相同空间截面，回水方向与供水相反。c=cp/10^6。"
api = "build_r4_heat_reconstruction"
test = "R4-HC1"
[[equation]]
id = "R4-HC2"
latex = 'c\,m_{ij}(S_i-S_{ij}^{out})=\widehat L_{ij}^{S},\quad c\,m_{ij}(R_j-R_{ij}^{out})=\widehat L_{ij}^{R}'
meaning = "分别冻结供回参考损耗；两式相加恢复父运行的总损耗，但不等于真实温度相关散热。"
api = "build_r4_heat_reconstruction"
test = "R4-HC2"
[[equation]]
id = "R4-HC3"
latex = 'H_i^{src}=c\,m_i^{src}(S_i^{src}-R_i),\qquad H_i^{load}=c\,m_i^{load}(S_i-R_i^{load})'
meaning = "本地源、荷端口与网络混合温度分开，不强迫热源出口和混合供温相同。"
api = "validate_r4_heat_reconstruction"
test = "R4-HC3"
[[equation]]
id = "R4-HC4"
latex = '\begin{aligned}m_i^{src}S_i^{src}+\sum_{p\to i}m_p S_p^{out}&=(m_i^{load}+\sum_{i\to p}m_p)S_i,\\m_i^{load}R_i^{load}+\sum_{i\to p}m_p R_p^{out}&=(m_i^{src}+\sum_{p\to i}m_p)R_i.\end{aligned}'
meaning = "分别检查供水和回水的加权混合；正入流时独立重算混合温度，A1为1e-4 K。"
api = "validate_r4_heat_reconstruction"
test = "R4-HC4"
[[equation]]
id = "R4-HC5"
latex = 'm_i^{src}+\sum_{p\to i}m_p=m_i^{load}+\sum_{i\to p}m_p,\qquad 0\le m_p\le u_p\overline m_p'
meaning = "质量守恒、方向与容量；所有设备/负荷/热交付和父费用冻结。"
api = "reconstruct_r4_heat"
test = "R4-HC5"

