julia = "m_pipe / m_source / m_load"
meaning = "供回管对质量流与非负源荷端口流；管道或节点×时间"
unit = "kg/s"
[[symbol]]
id = "hc_node_temperatures"
latex = 'S_i,R_i'
julia = "τ_S / τ_R"
meaning = "节点混合供温、混合回温；节点×时间；ASCII别名S/R"
