[[issue]]
id = "R4-T01"
topic = "网络松弛位置"
adopted = "原文未列逐约束松弛。本批仅四类节点平衡双向松弛，其余全部硬约束。严格网络和弹性网络独立保存，不把弹性解称为物理成功。"
[[issue]]
id = "R4-T02"
topic = "罚项与分歧效用"
adopted = "原式(4-98)未明确C_DHSO是否含罚项，两种解释并列，实际资源成本和人工罚金分别记录。固定同一AGNB计划对照100/10000罚系数。"
[[issue]]
id = "R4-T03"
topic = "总福利比较及稳定性"
adopted = "只有相同物理可行域嵌入或独立数值证据才能支持SW协调>=SW_P2P。松弛分歧点不保证此关系；(4-102)不认证所有子联盟或博弈核非空。"
[[issue]]
id = "R4-T04"
topic = "候选、交易、费用与支付"
adopted = "保留AG0嵌入和求解候选，按独立重算成本选择；负剩余不裁零。第二阶段总支付替代全部旧内部账单，不能再叠加第一阶段转移。服务费卖方每笔一次，双边能量乘Δt。"
