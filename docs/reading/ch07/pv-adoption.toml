schema = "r9-pv-adoption-v1"
model = "r9_72_cf_socp_v1 / r9_72_cf_original_grid_v1"
source = "chapter3 checked WMM and chapter7.2 topology/nameplates; missing fields use configs/r9/pv-protocol.toml"
scope = "44 electric nodes, 38 heat nodes, 24 hourly periods; CF-CT and CF-VT first; VF outstanding"
original_input_reproduction = false
test = "R9-P1:P6 44/38 periodic input and fixed-mode model"

[[equations]]
id = "R9-P1"
status = "project_input_conversion"
meaning = "视在功率与有功/无功；合成节点与时间分配"
latex = 'P=S\cos\varphi,\quad Q=S\sqrt{1-\cos^2\varphi}'
api = "r9_pv_case"
[[equations]]
id = "R9-P2"
status = "project_equivalent_network"
meaning = "线路电阻按电压基准折算；固定额定变比的理想变压器"
latex = 'r_{\mathrm{pu}}=R_{\Omega}S_{\mathrm{base}}/V_{\mathrm{base}}^2,\quad R_{10}=R_V(10/V)^2'
api = "audit_r9_pv_input"
[[equations]]
id = "R9-P3"
status = "project_pipe_design"
meaning = "由参考质量流量与速度确定截面积；圆筒导热和固定Darcy系数"
latex = 'A=m^0/(\rho u),\quad \epsilon=2\pi k/\ln((D+2b)/D),\quad \mu=fL/(2000\rho DA^2)'
api = "r9_pv_case"
[[equations]]
id = "R9-P4"
status = "source_heat_relation_with_declared_units"
meaning = "固定流量源/荷端口供回温差与热功率"
latex = 'H=10^{-6}c_pm(T^S-T^R)'
api = "audit_r9_pv_input"
[[equations]]
id = "R9-P5"
status = "project_periodic_reference_boundary"
meaning = "给定CF-CT日曲线按树计算周期WMM参考历史，不求解优化"
latex = 'T^{out}_{p,t}=T^a+(\sum_s w_{p,s}T^{in}_{p,\operatorname{mod1}(t-s,N)}-T^a)e^{-\epsilon_pL_p/(c_pm_p^0)}'
api = "audit_r9_pv_input"
[[equations]]
id = "R9-P6"
status = "project_terminal_memory"
meaning = "最终入口序列等于冻结初始历史；以最小流量所需记忆长度约束"
latex = 'L_p^h=\lceil M_p/(m_p^{min}\Delta t_s)\rceil,\quad T^{in}_{p,N-s}=T^{hist}_{p,-s},\ s=0,\ldots,L_p^h-1'
api = "build_r9_pv_model"

[[symbols]]
id = "r9.power_factor"
latex = '\cos\varphi'
meaning = "功率因数，项目替代值0.9"
unit = "1"
code = "electric.power_factor"
[[symbols]]
id = "r9.pipe_conductance"
latex = '\epsilon_p'
meaning = "单位管长传热系数，仅采用圆筒绝热层导热"
unit = "W/(m K)"
code = "heat.pipes[p].epsilon_W_mK"
[[symbols]]
id = "r9.pipe_friction"
latex = '\mu_p'
meaning = "压降二次系数；2000包含动压的2和Pa转kPa的1000"
unit = "kPa s^2/kg^2"
code = "heat.pipes[p].mu_kPa_s2_kg2"
[[symbols]]
id = "r9.memory_length"
latex = 'L_p^h'
meaning = "保守离散热记忆长度，与管道长度L分开"
unit = "time steps"
code = "build_r9_pv_model: L"
