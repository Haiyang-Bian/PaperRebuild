[[replacement_rule]]
id = "R9-R01"
rule = "Keep 44/38 source connectivity and original node labels. A root reindexing must preserve an explicit original-to-internal map."
[[replacement_rule]]
id = "R9-R02"
rule = "Use separately frozen public donor or synthetic impedances, capacities, pipe geometry and hourly profiles. Record per-field origin and conversion, not only one overall synthetic label."
[[replacement_rule]]
id = "R9-R03"
rule = "The high-voltage feeders and distribution substation sites are not one voltage bus model. Declare voltage bases and transformer representation, or mark an explicit equivalent-network approximation."
[[replacement_rule]]
id = "R9-R04"
rule = "Freeze physically checked steady history and terminal rule before comparing modes. Do not infer loads or efficiencies by fitting reported costs or renewable utilization."
[[replacement_rule]]
