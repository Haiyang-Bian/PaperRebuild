unit = "MW"
code = "H_plus_in[p,t], H_plus_out[p,t], H_minus_in[p,t], H_minus_out[p,t]"
[[symbols]]
id = "r9.trading.preference"
latex = 'w_{a,t}^{P},w_{a,t}^{H}'
meaning = "凸二次不满意度的每小时费用上图变量"
unit = "CNY/h"
code = "w_P[a,t], w_H[a,t]"
[[symbols]]
id = "r9.trading.cash"
latex = 'C_a^{\rm cash}'
meaning = "主体内部结算净收入；正数为收入"
unit = "CNY"
code = "internal_cash_CNY"

