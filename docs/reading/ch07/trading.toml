code = "actors[a]"
[[symbols]]
id = "r9.trading.device"
latex = 'g'
meaning = "设备，归属与电/热节点分别登记"
unit = "1"
code = "devices[g]"
[[symbols]]
id = "r9.trading.power"
latex = 'P_{g,t}^{\rm gen},P_{g,t}^{\rm cons}'
meaning = "设备电力注入与消耗；热量使用H"
unit = "MW"
code = "P_gen[g,t], P_cons[g,t]"
[[symbols]]
id = "r9.trading.storage"
latex = 'E_{g,t}'
meaning = "时段开始的电/热能量状态，末端另有T+1状态"
unit = "MWh"
code = "E[g,t]"
[[symbols]]
id = "r9.trading.heat_direction"
latex = 'y_{p,t}^{+},y_{p,t}^{-}'
meaning = "一对管道的热传递方向，二者之和为1；仍是温热管网假设"
unit = "1"
code = "heat_direction[p,t], 1-heat_direction[p,t]"
[[symbols]]
id = "r9.trading.flow"
latex = 'm_{p,t}^{\sigma}'
meaning = "按所选正向/反向弧定义的非负质量流量"
unit = "kg/s"
code = "m_plus[p,t], m_minus[p,t]"
[[symbols]]
id = "r9.trading.heat"
latex = 'H_{p,t}^{\sigma,\rm in},H_{p,t}^{\sigma,\rm out}'
