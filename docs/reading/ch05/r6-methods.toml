[[finding]]
id = "R6-MA01"
location = "PDF100–101，第5.6.3节"
classification = "project_adopted_six_method_definition"
original = "D忽略调用/采用平均情景；SP已知分布；RO最坏情况；DRO Wasserstein模糊集；CCP在SP上增加供热质量机会约束；DRJCC为提出模型。"
adopted = "同物理/市场结构，仅改变情景费用规则与舒适风险。SP使用训练代表经验分布而非已知真实分布；RO/DRO保证限于有限支持。D明确为均值PV/零调用，仍计该名义日内部调度费用。"
