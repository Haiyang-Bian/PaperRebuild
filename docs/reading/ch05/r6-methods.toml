[[equation]]
id = "R6-M1"
latex = 'P_{d,t}^{\rm PV,avail}=\bar P^{\rm PV}p_{d,t},\quad \alpha_{d,t}^{\rm up}=\max(a_{d,t},0),\quad \alpha_{d,t}^{\rm down}=\max(-a_{d,t},0)'
meaning = "比例乘MW额定容量，正上调意味着减少购电，两个调用比例每时段互斥；设备/初值/历史/终端不随轨迹改变。D用全部训练PV均值及零调用。"
api = "r6_dispatch_day"
test = "R6-PHYSICAL"
[[equation]]
id = "R6-M2"
latex = '\min_{b,x,y}\ C_{\rm market}(b,x)+\sup_{q\in\mathcal Q}\sum_s q_s C_s(y_s),\qquad \sup_{q\in\mathcal Q}\sum_s q_s z_s\le\epsilon'
meaning = "D/SP/CCP固定经验概率；D使用唯一名义日。RO取全部有限支持概率，DRO/DRJCC取运输球。D/SP/RO/DRO固定全部z=0，CCP/DRJCC采用整日机会约束。所有方法使用同一连续报价和乐观市场KKT。费用与风险有两套独立最坏分布；未更换为外生固定价格。"
api = "R6MethodSpec"
test = "R6-METHOD"
[[equation]]
id = "R6-M3"
latex = '\rho_{\rm RO}=\max_{i,j}D_{ij},\qquad \Pi_{ij}=q_i p_j\ \Longrightarrow\ \sum_{ij}D_{ij}\Pi_{ij}\le\rho_{\rm RO},\quad \sup_{q\in\Delta_N}\sum_iq_iC_i=\max_i C_i'
meaning = "任意有限支持概率q均有可行运输Pi，故该半径覆盖完整有限单纯形。反之运输边际仍是该单纯形，得到等价最坏情景费用。rho=0且非对角距离严格正时唯一边际为p，恢复经验期望；R6拒绝重复支持，避免静默合并或误称唯一经验分布。保证不延伸到支持外轨迹。"
api = "r6_training_case"
test = "R6-ROBUST"

