[[issue]]
id = "R5-EX-C01"
original = "已核读原式定义市场福利与KKT，没有给出多最优选择的完整执行细则。"
adopted = "选择最小范数制度作为单独项目对照；不冒称作者规则、现实市场制度或悲观策略解。"
evidence = "原最优值、唯一选择证书和内部交付分别保存。"
[[issue]]
id = "R5-EX-C02"
original = "原始成交与对偶价格都可能多解；有限报价不保证有限价格面。"
adopted = "严格凸且强制的平方范数在非空闭最优面上取得唯一最小值；即使原面无界也不需要价格截断。"
evidence = "解析QP、原始乘子、单位尺度和稀缺价格反例；价格选择依赖完整声明的对偶表示。"
[[issue]]
id = "R5-EX-C03"
original = "旧策略最优解依赖乐观原始/对偶选择。"
adopted = "旧报价在新制度下只作执行评价，不能把固定报价/成交后的条件补救界称策略全局界。"
evidence = "旧选定、旧独立和新选择成交分别固定；不调整成交制造可交付性，不覆盖历史结果。"
