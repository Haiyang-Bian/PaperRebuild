latex = 'y^\dagger=\arg\min_{y\in Y,\ c(o)^\mathsf Ty=f^\star(o)}\frac12\sum_k(y_k/s_P)^2'
meaning = "先保持原市场最优值，再对全部成交作严格凸最小范数选择；不是给原福利目标加epsilon。"
