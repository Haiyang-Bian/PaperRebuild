[[equation]]
id = "R5-EX2"
source_equations = ["5-43至5-58"]
latex = '\xi^\dagger=\arg\min_{\xi\in\mathcal D(o),\ D(\xi)=f^\star(o)}\frac12\sum_j(\xi_j/(\Delta t\,s_\pi))^2'
meaning = "对原独立对偶的全部显式乘子采用统一正权重，选出唯一价格；不隐式设置乘子界。规则依赖声明的对偶表示。"
api = "solve_r5_market_execution"
test = "R5-EX 单位尺度与选择证书"
[[equation]]
id = "R5-EX3"
source_equations = ["项目选择问题KKT"]
latex = 'Hx+A^\mathsf T\mu=0,\quad d(\mu)=b^\mathsf T\mu-\tfrac12(A^\mathsf T\mu)^\mathsf TH^{-1}(A^\mathsf T\mu)'
meaning = "选择QP行按Ax+b<=0或=0保存；H正对角。由原始MOI乘子独立核验驻点、符号、互补与原对偶差。"
api = "validate_r5_market_execution"
test = "R5-EX 严格凸选择与原始乘子"
[[equation]]
id = "R5-EX4"
source_equations = ["5-33", "5-66", "5-68"]
latex = '(P_t^{DA},R_t^U,R_t^D)=(P_t^{IES,\dagger},R_t^{IES,U,\dagger},R_t^{IES,D,\dagger}),\quad C_{\rm exec}=\Pi(y^\dagger,\xi^\dagger)+\min_{\text{recourse}}\sup_{p\in\mathcal P}\sum_s p_sQ_s'
meaning = "固定市场实际成交，在原风险/设备/历史边界下重新求补救；原变量界保持，条件最优界不作为策略报价全局界。"
api = "evaluate_r5_execution_delivery"
test = "R5-EX 市场唯一选择与固定交付"

