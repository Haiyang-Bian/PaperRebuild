[[issue]]
id = "R5-SP-C01"
original = "PDF90原(5-59)右侧印为Upsilon减去发电能量报价成本减上/下备用报价成本的括号，与(5-34)的三类成本同为正不一致。"
adopted = "由已经独立核查的出清原问题重新移项：Z-C_G，C_G三项均为正相加。保留印刷式，不假定作者实际程序也使用该符号。"
evidence = "一小时教学例Z=-1280、发电能量1600、上备用100、下备用20；左侧-3000，采用移项-3000，印刷移项-2760，相差240 USD。"
[[issue]]
id = "R5-SP-C02"
original = "5-61给出了线性净支付形式；采用市场还显式区分报价容量和物理容量，并给定非零初始出力。"
adopted = "保留发电报价上界、线路租金、普通负荷节点价及初始爬坡项。先验算全时域恒等式，再作为策略报价构建依据。"
evidence = "首时段负荷100、廉价机组初始30、上升20 MW，初始爬坡项为900 USD；省略会破坏恒等式。"
[[issue]]
id = "R5-SP-C03"
original = "PDF85明确price maker；PDF86说明在不能影响市场价时退化为price taker；(5-32)约束策略报价。"
adopted = "旧固定价风险模型是价格接受者基准。接入原(5-32)连续报价及出清KKT才可评价价格制定；不把菜单搜索替代连续报价后称原双层问题完成。"
evidence = "本批仅实现支付恒等式；双层决策、互补处理及报价边界仍须单独实施与验证。"
