[[equation]]
id = "R5-SP2"
source_equations = ["5-34", "5-59"]
latex = '-\Delta t\sum_{i,t}(v_{it}q_{it}-b_{it}^Uu_{it}-b_{it}^Dd_{it})=Z-C_G,\quad C_G=\Delta t\sum_{g,t}(c_{gt}p_{gt}+b_{gt}^Uu_{gt}+b_{gt}^Dd_{gt})'
meaning = "从出清目标移项时，发电机的三类报价成本都必须被减去。固定普通负荷效用已在两侧一致省略。"
api = "r5_market_payment_identity"
test = "R5-SP 全时域支付与强对偶线性式"

[[equation]]
id = "R5-SP3"
source_equations = ["5-58", "5-60", "5-61"]
latex = '\Pi^{\rm IES}=C_G+\mathcal R_G^{\rm cap}+\mathcal R_G^{\rm bid}+\mathcal R^{\rm ramp}+\mathcal R^{\rm line}-\Delta t\sum_{b,t}\lambda_{bt}D_{bt}-\sum_t(\sigma_t^UR_t^{\rm sys,U}+\sigma_t^DR_t^{\rm sys,D})'
meaning = "发电机驻点、互补及系统守恒给出的净支付线性表达；适用于全部IES合计，不保证逐时成立。"
api = "r5_market_payment_identity"
test = "R5-SP 全时域支付与强对偶线性式"

