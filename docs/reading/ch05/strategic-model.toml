[[equation]]
id = "R5-ST1"
source_equations = ["5-32", "5-34", "5-43至5-50"]
latex = 'Ay=b,\quad Gy\le h,\quad y\ge0,\quad c(o)+A^\mathsf T\pi+G^\mathsf T\mu-\delta=0'
meaning = "下层目标系数c随连续报价o改变。等式乘子自由，其他乘子非负；所有市场原始行及变量下界均计入。报价界按原5-32显式输入。"
api = "build_r5_strategic"
test = "R5-ST 连续报价与独立下层"

[[equation]]
id = "R5-ST2"
source_equations = ["5-51至5-57"]
latex = 's=h-Gy\ge0,\quad \mu\ge0,\quad (\mu_j,s_j)\in\mathrm{SOS1},\qquad (\delta_k,y_k)\in\mathrm{SOS1}'
meaning = "两个非负量至多一个非零表达互补，不设置任意乘子上界；这是项目求解表示。风险舒适开关的大M仍来自显式温度域，不能与对偶M混为一谈。"
api = "build_r5_strategic"
test = "R5-ST 连续报价与独立下层"

[[equation]]
id = "R5-ST3"
source_equations = ["5-33"]
latex = 'P_t^{\mathrm{DA}}=P_t^{\mathrm{IES}},\qquad R_t^U=R_t^{\mathrm{IES},U},\qquad R_t^D=R_t^{\mathrm{IES},D}'
meaning = "共同承诺与市场成交逐时相等，两侧同为MW；不按内部设备容量缩放成交。补救仍须逐情景满足原采用物理关系。"
api = "validate_r5_strategic"
test = "R5-ST 连续报价与独立下层"

[[equation]]
id = "R5-ST4"
source_equations = ["5-6", "5-61", "5-66", "5-68"]
latex = '\min_{o,y,\pi,\mu,\delta,x,z}\ \Pi^{\mathrm{IES}}(y,\pi,\mu)+\sup_{p\in\mathcal P}\sum_i p_i Q_i(x_i),\qquad \sup_{p\in\mathcal P}\sum_i p_i z_i\le\epsilon'
meaning = "采用全时域支付恒等式R5-SP3连接风险补救；内嵌补救的日前价格显式为零，避免重复计费。费用和事件的最坏分布独立。所有下层最优变量共同由上层选择，是显式乐观解释。"
api = "solve_r5_strategic"
test = "R5-ST 连续报价与独立下层"

[[equation]]
id = "R5-ST5"
source_equations = ["5-58", "5-61"]
latex = '\Pi_{\min/\max}(\bar y,\bar o)=\min/\max_{\pi,\mu}\{\Pi(\bar y,\pi,\mu):\ (\pi,\mu)\in\mathcal D(\bar o),\ D(\pi,\mu)=c(\bar o)^\mathsf T\bar y\}'
meaning = "固定原始成交和报价，在对偶最优面上分别求支付两端；不改变成交、不截断价格。强对偶与双边可行性保证对应下层最优，不证明悲观双层决策已求解。"
api = "r5_market_settlement_range"
test = "R5-ST 固定成交价格最优面"

