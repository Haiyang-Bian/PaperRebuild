[[issue]]
id = "R5-ST-C01"
original = "原5-32为连续价格报价；原文未完整给出多最优出清的执行规则。"
adopted = "单领导者连续报价，固定可报价容量，明确乐观原始/对偶选择；固定报价变体仍采用相同选择规则。"
evidence = "独立下层只比较最优值并核验KKT，不强迫成交和价格一致；另测固定成交支付范围。"
[[issue]]
id = "R5-ST-C02"
original = "KKT互补常用大M表达，但原页不足以给出所有有效对偶界。"
adopted = "SOS1原生表达，Gurobi PreSOS1BigM=0；不支持原生SOS1的求解器明确拒绝。开放求解器用于显式固定分支。"
evidence = "记录实际MOI类型；固定分支只报告该分支界；不能把其目标当作一般全域下界。"
[[issue]]
id = "R5-ST-C03"
original = "原5-6净支付和实时补救共同组成IES目标。"
adopted = "风险模板日前价格显式为零，净支付按所选真实出清乘子另计；不将上层界复用为风险子记录或市场界。"
evidence = "独立检查支付直接乘积与仿射式、三个运输证书及费用分项；缺失认证保留候选未决。"
[[issue]]
id = "R5-ST-C04"
original = "价格制定者改善私人目标不自动改善总体资源成本。"
adopted = "手算阶梯例分别记录IES支出和外部/内部发电资源费，明确固定报价对照与完全价格接受者不是同一概念。"
evidence = "预定低价容量0.2MW、普通负荷0.1MW、IES需求0.142MW及20/100/130三价格；不按收益调整参数。"
