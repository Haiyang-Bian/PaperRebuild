scope = "Fixed-price shared commitments with finite-support Wasserstein cost and joint indoor comfort risk. Not strategic market clearing, continuous support, online control or out-of-sample certification."

[[equation]]
id = "R5-R1"
original_ids = ["5-63","5-64","5-65","5-66","5-67","5-68","5-69"]
latex = '\mathcal U_\rho=\{\pi:\pi_i=\sum_j\Pi_{ij},\ \Pi\ge0,\ \sum_i\Pi_{ij}=\widehat p_j,\ \sum_{ij}d_{ij}\Pi_{ij}\le\rho\}'
meaning = "列j为经验来源，行i为目的支持点；不同时固定行和。对角运输证明非空，质量守恒给有界多面体。原5-64行列记号按文字和5-68统一；半径本批人为冻结，没有统计校准。"
api = "r5_worst_distribution"
test = "R5-R transport primal dual and joint event"
[[equation]]
id = "R5-R2"
original_ids = ["5-71","5-73","5-74"]
latex = '\min_{x,y,z,\lambda_C,\nu_C}c^\mathsf Tx+\lambda_C\rho+\sum_j\widehat p_j\nu_{C,j},\qquad\lambda_Cd_{ij}+\nu_{C,j}\ge q_i(y_i),\quad\lambda_C\ge0,\quad\nu_C\in\mathbb R^N'
meaning = "全情景直接模型对最坏补救费用取运输对偶，q可为负；日前支出只计一次。物理约束及共同x沿用已核查解释。本批不含原5-72中的报价/出清KKT，不冒称完整策略模型。"
api = "build_r5_risk"
test = "R5-R direct MILP and all comfort branches"
[[equation]]
id = "R5-R3"
original_ids = ["5-70","5-75","5-76","5-80","5-81"]
latex = 'z_i\in\{0,1\},\quad\underline T_j-(\underline T_j-L_j)z_i\le T_{jti}\le\overline T_j+(U_j-\overline T_j)z_i,\quad L_j\le T_{jti}\le U_j'
meaning = "z=0约束该情景全部楼宇/时段上下界。最小有效M来自显式物理域L/U。存在性等价：真实违约指示可用作z，反向只需z覆盖实际事件。原5-75仍有事件方向冲突；采用5-70/80，不强迫z=1一定越界。"
api = "build_r5_risk"
test = "R5-R direct MILP and all comfort branches"
[[equation]]
id = "R5-R4"
original_ids = ["5-77","5-78","5-79","5-82","5-83","5-84"]
latex = '\lambda_R\rho+\sum_j\widehat p_j\nu_{R,j}\le\varepsilon,\qquad\lambda_Rd_{ij}+\nu_{R,j}\ge z_i,\quad\lambda_R\ge0,\quad\nu_R\in\mathbb R^N'
meaning = "风险对手与费用对手分开。由R5-R1原LP推导列和乘子自由；不沿用5-83列和项多余距离因子。5-77末尾未定义k不引入额外集合。"
api = "validate_r5_transport"
test = "R5-R transport primal dual and joint event"
[[equation]]
id = "R5-R5"
original_ids = []
latex = '\underline J=\min_b\underline J_b,\qquad\overline J=c^\mathsf Tx+\sup_{\pi\in\mathcal U_\rho}\sum_i\pi_iq_i(y_i),\qquad G=\frac{\max(0,\overline J-\underline J)}{\max(1,|\overline J|,|\underline J|)}'
meaning = "全枚举只有全部分支被认证或证明不可行时才合成全局下界；部分枚举保留候选但不给全局证书。固定分支仍不是全问题。"
api = "solve_r5_risk"
test = "R5-R direct MILP and all comfort branches"

