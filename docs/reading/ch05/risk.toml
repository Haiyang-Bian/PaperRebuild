unit="synthetic USD"
julia="recourse_cost, solver_objective_bound, worst_net_cost"

[[issue]]
id="R5-R-C01"
adopted="费用和风险最大化各自取最坏分布；不能用费用最坏权重替代联合风险。非空有界运输LP的强对偶来自基本LP理论；有限支持结论不继承连续分布保证。"
[[issue]]
id="R5-R-C02"
adopted="原(5-75)与(5-70)/(5-80)冲突，原式保留。逐情景一个开关只解除室温舒适，不解除水温、建筑末期、设备、负荷、网络及交付。"
[[issue]]
id="R5-R-C03"
adopted="新增有限室温物理域是显式项目边界，不冒称原参数；本批舒适带上下各延伸1 K，仅用来限定放松幅度及推导M。热灵活性手算例另外声明末期室温free和0.1小时管延迟。"
[[issue]]
id="R5-R-C04"
adopted="完整情景轨迹补救与固定价格继续沿用；未实现市场策略报价、在线非预见性或统计半径选择。名义情景概率为正，最坏权重可为零，不能除以零提取条件乘子。"
[[issue]]
id="R5-R-C05"
adopted="零权重可能使某情景费用/误差上图不紧；原始值不裁剪。独立费用按真实交付误差计算，模型上图费用另列；无负罚价，减少误差上图保留原约束并不增费用，不声称所有条件补救已最优。"
[[issue]]
id="R5-R-C06"
adopted="实际事件同时记录原始严格越界和超过A1温度带1e-4 K的分类；不把浮点极小偏差当确定科学违约。风险上界来自覆盖事件的开关证书，概率门槛仍1e-8。"
