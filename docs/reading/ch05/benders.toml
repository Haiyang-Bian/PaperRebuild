[[equation]]
id="R5-BD1"
original_ids=["5-87","5-88","5-89","5-90"]
latex='Q_{s,b}(x)=\min_y c_s^\mathsf Ty,\qquad A_{s,b}y\ \bowtie\ b_{s,b}+B_sx,\quad y\in[\underline y_s,\overline y_s]'
meaning="固定情景和舒适分支后为LP。日前承诺只进入交付、误差正负行及容量预算右端；补救目标不含日前常数。舒适分支不同的割不可无条件共享。"
api="build_r5_benders_subproblem"
test="R5-BD finite input bounds and parameter rows"
[[equation]]
id="R5-BD2"
original_ids=["5-3","5-4","5-19","5-25","5-26"]
latex='L_s=\sum_k\min\{c_{sk}\underline y_{sk},c_{sk}\overline y_{sk}\},\quad \Delta P_t\in[\underline P_t^{DA}-\overline P^{PCC},\overline P_t^{DA}-\underline P^{PCC}],\quad 0\le e_t\le\delta\sum_\tau(R^u_\tau+R^d_\tau)^{\max}'
meaning="输入有限盒给出允许负值的费用下界；等长时间步在逐时误差上界中相消。热量上界由比热、流量、供回温差推导，管出口温度由独立线性输运区间推导。实际实现对下界增加显式舍入余量，不读取优化结果选界。"
api="r5_benders_bounds"
test="R5-BD finite input bounds and parameter rows"
[[equation]]
id="R5-BD3"
original_ids=["5-94","5-95","5-96","5-97","5-98"]
latex='F_{s,b}(x)=\min_{y,a}\sum_r\frac{a_r^++a_r^-}{M_r},\qquad A_ry+a_r^+-a_r^-\ \bowtie\ b_r+B_rx,\quad y\in[\underline y_s,\overline y_s]'
meaning="项目phase-I放松全部非盒关系和所选舒适界，物理域盒保持硬约束。等式两向松弛，>=仅加正松弛，<=仅减负松弛。M由完整x/y盒推导并冻结，松弛也有有限上界。零诊断目标才对应原关系可行；与原5-96在z=0仍保持硬舒适的设置不同。"
api="build_r5_benders_subproblem"
test="R5-BD elastic feasibility and hard physical boundary"
[[equation]]
id="R5-BD4"
original_ids=["5-91","5-92"]
latex='r=c-A^\mathsf T\lambda,\quad E=\sum_k|r_k|Y_k+\sum_r\lambda_r^{\mathrm{wrong}}V_r+E_{\mathrm{fp}},\qquad \ell(x)=\lambda^\mathsf T(b+Bx)-E'
meaning="Y为变量绝对值盒界，V为全x/y盒上的约束松弛绝对界。>=要求lambda>=0，<=要求lambda<=0，等式自由。先通过未放宽的KKT，再扣除微小数值误差的界；原始乘子不裁剪。E_fp为1e-10乘以预先定义运算尺度，属浮点保护量，不是有理数/区间算术证书。"
api="r5_benders_cut"
test="R5-BD signed multipliers and bounded numerical guards"
[[equation]]
id="R5-BD5"
original_ids=["5-91","5-92"]
latex='\theta_s\ge L_s,\qquad\theta_s\ge\ell_{s,b}(x)-M_{s,b}(1-\mathbf1\{z_s=b\}),\quad M_{s,b}=\max\{0,\max_{x\in X_{\mathrm{box}}}\ell_{s,b}(x)-L_s\}'
meaning="成本条件割在匹配分支生效；不匹配时相对theta>=L冗余，负费用仍可行。有限盒对仿射函数求上界得到M；主问题只从通过独立检查的来源重建割。"
api="r5_benders_cut"
test="R5-BD recourse KKT and conditional cuts"
[[equation]]
id="R5-BD6"
original_ids=["5-94","5-99","5-100","5-101"]
latex='\gamma_{s,b}(x)\le F_{s,b}(x),\qquad\gamma_{s,b}(x)\le M^F_{s,b}(1-\mathbf1\{z_s=b\}),\quad M^F_{s,b}=\max\{0,\max_{x\in X_{\mathrm{box}}}\gamma_{s,b}(x)\}'
meaning="诊断的条件可行性割只排除其来源分支下不能零违反的点。来源点gamma<=1e-8时记为没有排除作用，不虚报迭代进展。该可行性割是项目实现选择；critical路线改为插入对应情景完整可行性关系，分别记录。"
api="r5_benders_cut"
test="R5-BD elastic feasibility and hard physical boundary"

[[equation]]
id="R5-BD7"
original_ids=["5-85","5-86","5-93"]
latex='\min_{x,z,\theta,\lambda,\nu} c_0^\mathsf Tx+\rho\lambda_c+\sum_jp_j\nu^c_j,\quad \nu^c_j+\lambda_c d_{ij}\ge\theta_i,\quad \nu^r_j+\lambda_r d_{ij}\ge z_i,\quad \rho\lambda_r+\sum_jp_j\nu^r_j\le\epsilon,\quad \lambda_c,\lambda_r\ge0'
meaning="完整有限支持运输对偶进入MILP主问题；费用和风险对手分别优化。与原5-85只用当前最坏权重的写法不同，属项目采用结构。theta以有效负费用下界和条件割约束，不将负净费用删掉。"
api="build_r5_benders_master"
test="R5-BD master domains and full decomposition"
[[equation]]
id="R5-BD8"
original_ids=["5-99","5-100","5-101","5-102"]
latex='s\in C_k:\ A_sy_s\ \bowtie\ b_s+B_sx,\quad \underline T_s-(\underline T_s-\underline T_s^{phys})z_s\le T_s\le\overline T_s+(\overline T_s^{phys}-\overline T_s)z_s;\qquad \text{paper-critical only:}\ s\notin C_k\Rightarrow z_s=0'
meaning="关键情景完整可行性关系与主问题辅助调度共同优化，费用仍由割约束。critical保留全部z，paper_critical实施5-102外集固定，后者域受限。关键集扩张后不能累计旧受限下界；外集为空才退化到完整域。"
api="build_r5_benders_master"
test="R5-BD history scope persistence and failure propagation"
[[equation]]
id="R5-BD9"
original_ids=["5-91","5-92"]
latex='g=B^\mathsf T\lambda,\quad E_{coef}=\sum_k|g_k-\widehat g_k|X_k,\quad \widehat\ell(x)=\operatorname{round}_{-\infty}\!\left[\lambda^\mathsf Tb-E_{stat}-E_{sign}-E_{coef}\right]+\widehat g^\mathsf Tx'
meaning="rational_box将已编码Float64系数和未裁剪的单位转换后乘子作为精确二进制有理数计算。驻点/符号及梯度转换误差在有限盒上扣除，截距向下舍入，停用M向上舍入。只认证编码LP的割，不继承物理模型、输入精度或整数求解的精确性保证；旧float_box仍保留。"
api="r5_benders_cut"
test="R5-BD exact encoded cuts and equivalent scaling"
[[equation]]
id="R5-BD10"
original_ids=["5-94","5-95","5-97","5-98"]
latex='u=\sigma y,\quad Au\ \bowtie\ \sigma(b+Bx),\quad \min_u(c/\sigma)^\mathsf Tu,\qquad y=u/\sigma,\quad \lambda=\sigma\lambda_{solver},\qquad \sigma=2^{10}'
meaning="诊断LP的等价二次幂表示。约束系数不变，右端及变量变大，目标系数相应缩小；不改变物理模型或验收阈值。分别保存求解器原始u/lambda_solver与还原量，检查变换一致。来源边界反例中原表示的微小负弹性量曾抵消正违反；缩放对照有单独记录，不修改原乘子制造通过。"
api="build_r5_benders_subproblem"
test="R5-BD exact encoded cuts and equivalent scaling"
[[equation]]
id="R5-BD11"
original_ids=["5-85","5-93"]
latex='UB_k=\min_{i\le k:\,\mathrm{verified}}\{c_0^\mathsf Tx_i+\rho\lambda^c_i+\sum_jp_j\nu^c_{ij}\},\quad LB_k=\max_{i\le k:\,\mathrm{full\ domain}}LB_i^{master},\quad UB_k-LB_k\le10^{-7}+10^{-6}\max(1,|UB_k|,|LB_k|)'
meaning="上界仅来自全情景模型/风险/费用通过的完整策略和费用运输对偶；下界保留有效来源/作用域。受限域只用当前主问题界与同域候选判断，不宣称完整域费用完成。费用A2相对间隙1e-4单列；失败、超时和无新割不等于不可行，最后失败保留旧最佳候选。"
api="validate_r5_benders"
test="R5-BD history scope persistence and failure propagation"

