[[equation]]
id="R5-BD1"
original_ids=["5-87","5-88","5-89","5-90"]
latex='Q_{s,b}(x)=\min_y c_s^\mathsf Ty,\qquad A_{s,b}y\ \bowtie\ b_{s,b}+B_sx,\quad y\in[\underline y_s,\overline y_s]'
meaning="固定情景和舒适分支后为LP。日前承诺只进入交付、误差正负行及容量预算右端；补救目标不含日前常数。舒适分支不同的割不可无条件共享。"
api="build_r5_benders_subproblem"
test="R5-BD finite input bounds and parameter rows"
[[equation]]
id="R5-BD2"
original_ids=["5-3","5-4","5-19","5-25","5-26"]
latex='L_s=\sum_k\min\{c_{sk}\underline y_{sk},c_{sk}\overline y_{sk}\},\quad \Delta P_t\in[\underline P_t^{DA}-\overline P^{PCC},\overline P_t^{DA}-\underline P^{PCC}],\quad 0\le e_t\le\delta\sum_\tau(R^u_\tau+R^d_\tau)^{\max}'
meaning="输入有限盒给出允许负值的费用下界；等长时间步在逐时误差上界中相消。热量上界由比热、流量、供回温差推导，管出口温度由独立线性输运区间推导。实际实现对下界增加显式舍入余量，不读取优化结果选界。"
api="r5_benders_bounds"
test="R5-BD finite input bounds and parameter rows"
[[equation]]
id="R5-BD3"
original_ids=["5-94","5-95","5-96","5-97","5-98"]
latex='F_{s,b}(x)=\min_{y,a}\sum_r\frac{a_r^++a_r^-}{M_r},\qquad A_ry+a_r^+-a_r^-\ \bowtie\ b_r+B_rx,\quad y\in[\underline y_s,\overline y_s]'
meaning="项目phase-I放松全部非盒关系和所选舒适界，物理域盒保持硬约束。等式两向松弛，>=仅加正松弛，<=仅减负松弛。M由完整x/y盒推导并冻结，松弛也有有限上界。零诊断目标才对应原关系可行；与原5-96在z=0仍保持硬舒适的设置不同。"
api="build_r5_benders_subproblem"
test="R5-BD elastic feasibility and hard physical boundary"
[[equation]]
id="R5-BD4"
original_ids=["5-91","5-92"]
latex='r=c-A^\mathsf T\lambda,\quad E=\sum_k|r_k|Y_k+\sum_r\lambda_r^{\mathrm{wrong}}V_r+E_{\mathrm{fp}},\qquad \ell(x)=\lambda^\mathsf T(b+Bx)-E'
meaning="Y为变量绝对值盒界，V为全x/y盒上的约束松弛绝对界。>=要求lambda>=0，<=要求lambda<=0，等式自由。先通过未放宽的KKT，再扣除微小数值误差的界；原始乘子不裁剪。E_fp为1e-10乘以预先定义运算尺度，属浮点保护量，不是有理数/区间算术证书。"
api="r5_benders_cut"
test="R5-BD signed multipliers and bounded numerical guards"
[[equation]]
id="R5-BD5"
original_ids=["5-91","5-92"]
latex='\theta_s\ge L_s,\qquad\theta_s\ge\ell_{s,b}(x)-M_{s,b}(1-\mathbf1\{z_s=b\}),\quad M_{s,b}=\max\{0,\max_{x\in X_{\mathrm{box}}}\ell_{s,b}(x)-L_s\}'
meaning="成本条件割在匹配分支生效；不匹配时相对theta>=L冗余，负费用仍可行。有限盒对仿射函数求上界得到M。当前实现返回割系数和M，主问题插入及完整迭代待后续。"
api="r5_benders_cut"
test="R5-BD recourse KKT and conditional cuts"
[[equation]]
id="R5-BD6"
original_ids=["5-94","5-99","5-100","5-101"]
latex='\gamma_{s,b}(x)\le F_{s,b}(x),\qquad\gamma_{s,b}(x)\le M^F_{s,b}(1-\mathbf1\{z_s=b\}),\quad M^F_{s,b}=\max\{0,\max_{x\in X_{\mathrm{box}}}\gamma_{s,b}(x)\}'
meaning="诊断的条件可行性割只排除其来源分支下不能零违反的点。来源点gamma<=1e-8时记为没有排除作用，不虚报迭代进展。该可行性割是项目实现选择，关键情景全约束策略尚待独立对照。"
api="r5_benders_cut"
test="R5-BD elastic feasibility and hard physical boundary"

