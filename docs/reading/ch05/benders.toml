[[issue]]
id="R5-BD-C01"
adopted="原5-91/92停用到零要求另有非负补救费用假设；当前实时收入允许负费用。由显式盒推导负下界后生成条件割；项目合成负费用测试不证明作者原输入也为负。"
[[issue]]
id="R5-BD-C02"
adopted="每个情景独立求补救并读取条件LP原始对偶，完全不除以最坏分布权重。零权重不免除物理或条件最优性检查；费用和风险对手仍须分开。"
[[issue]]
id="R5-BD-C03"
adopted="原5-96在z=0时没有舒适松弛，诊断未必总可行。项目phase-I显式按物理盒放松所有非盒关系及舒适界，诊断尺度和范围不同于原式；排序影响待关键情景实验，不能叫笔误修正。"
[[issue]]
id="R5-BD-C04"
adopted="原5-102把关键集之外z固定为0，限制舒适策略域。paper_critical的界只属于该域；关键集扩张后不累计旧受限下界。开发手算中受限路线与完整路线恰巧费用相同，仍只记录restricted_domain_gap，不当完整域证明。正式算法批次待冻结。"
[[issue]]
id="R5-BD-C05"
adopted="原算法页只称sigma足够小，未给具体数值。项目外层最多200轮、绝对1e-7/相对1e-6，共享600秒；KKT1e-6、A1/A2不放宽。旧float_box保护不是严格有理证明，新增rational_box只对编码LP的割做有理运算；不得混成整个算法精确认证。"
[[issue]]
id="R5-BD-C06"
adopted="纯割开发反例先受float_box约2.69e-7保护量影响；改有理算术后仍在约1.30e-9 MW处停滞。原phase-I负松弛约-3.3e-10抵消正电平衡违反，不能由近零目标认定可行。预声明1024倍等价表示解除该手算反例；保留旧记录，不普遍宣称数值问题消失。"
