[[issue]]
id="R5-BD-C01"
adopted="原5-91/92停用到零要求另有非负补救费用假设；当前实时收入允许负费用。由显式盒推导负下界后生成条件割；项目合成负费用测试不证明作者原输入也为负。"
[[issue]]
id="R5-BD-C02"
adopted="每个情景独立求补救并读取条件LP原始对偶，完全不除以最坏分布权重。零权重不免除物理或条件最优性检查；费用和风险对手仍须分开。"
[[issue]]
id="R5-BD-C03"
adopted="原5-96在z=0时没有舒适松弛，诊断未必总可行。项目phase-I显式按物理盒放松所有非盒关系及舒适界，诊断尺度和范围不同于原式；排序影响待关键情景实验，不能叫笔误修正。"
[[issue]]
id="R5-BD-C04"
adopted="原5-102把关键集之外z固定为0，限制舒适策略域。未来受限对照的界只能属于该域；关键集扩张后不能累计旧受限下界作为完整模型下界。当前仅完成接口规则，未执行该对照。"
[[issue]]
id="R5-BD-C05"
adopted="原算法页只称sigma足够小，未给具体数值。项目Spec预声明最多200轮、绝对1e-7/相对1e-6；外层尚未实现，不把Spec存在计作算法完成。KKT1e-6、A1/A2不放宽，浮点保护不是严格有理证明。"
