[[issue]]
id = "R5-M01"
equations = ["5-1", "5-2", "5-3", "5-8", "5-13", "5-33", "5-39"]
pages = [85, 86, 87, 89]
original = "5-1 actual purchase = day-ahead purchase + deviation; 5-2 upward minus downward reserve; 5-3 absolute difference between request and deviation; 5-8 negative real-time-price times deviation."
evidence = "5-39 defines reserve headroom as Pmin+RU <= P_DA <= Pmax-RD, and text identifies P_DA as purchased power."
status = "checked_sign_choice_derived_tests_pending"
adopted = "Keep purchased power positive. Delivery d=P_DA-P_actual, positive for upward reserve. Retain request=alpha_U*RU-alpha_D*RD, mismatch=abs(request-d), real-time cost=-price_RT*d. Preserve the original plus sign separately."
equivalent = "If actual-minus-day-ahead deviation Delta is used, set Delta=-d, request mismatch=abs(request+Delta), real-time cost=+price_RT*Delta. Never combine the two sign conventions."
test_target = "P_DA=1 MW, RU call=.2 MW => actual=.8 MW, mismatch=0, real-time credit=.2*price*dt; downward call reverses."

[[issue]]
id = "R5-M02"
equations = ["5-9", "5-12", "5-14", "5-29", "5-31"]
pages = [86, 87, 88]
original = "5-14 places EB electric power on the generation side although 5-12 produces positive heat from COP times EB power."
status = "conservation_correction_derived_tests_pending"
adopted = "For a nonnegative EB electrical-consumption variable, generation plus incoming flow equals outgoing flow plus base electrical load plus EB and local-heater consumption. A signed negative EB convention is possible only with explicitly transformed bounds and heat equation."
test_target = "Zero generation, .1 MW base load and .2 MW EB => .3 MW import, not -.1 MW."

[[issue]]
id = "R5-M03"
equations = ["5-18", "5-19", "5-20", "5-21", "5-22", "5-23", "5-24", "5-25", "5-26"]
pages = [87, 88]
status = "chapter_specific_physics"
evidence = "Hat mass flow and K/J delay/loss coefficients are given coefficients; 5-25 explicitly separates initial-history contribution."
adopted = "Use fixed positive pipe flow and signed nodal source/load convention only after validating conservation. Specify initial temperature history explicitly, and independently check supply/return mixing. Do not inherit R4 idle decisions, variable-flow nonlinearity or steady-only pipe equations."
remaining = "Several mixing indices in 5-20/21/23 are inconsistent; rebuild incidence-based mass/enthalpy sums and map each adopted equation separately."

[[issue]]
id = "R5-M04"
equations = ["5-27", "5-28", "5-29", "5-30", "5-31"]
pages = [88]
status = "local_blocking_ambiguity"
original = "5-27 uses district-delivered H_D in building dynamics; 5-30 reduces H_D when local heating H_DH increases; text calls hat H_D total demand."
remaining = "Trace chapter 2 coefficients and decide whether comfort responds to total delivered heat H_D+H_DH or another explicitly defined heating input. Restore heat capacity and time-step units. Do not quietly exclude the local heater from room heating."

[[issue]]
id = "R5-M05"
equations = ["5-34", "5-35", "5-36", "5-37", "5-38", "5-39", "5-40", "5-41", "5-42", "5-43", "5-44", "5-45", "5-46", "5-47", "5-48", "5-49", "5-50", "5-51", "5-52", "5-53", "5-54", "5-55", "5-56", "5-57", "5-58", "5-59", "5-60", "5-61"]
pages = [89, 90, 91]
status = "rederive_before_bilevel"
evidence = "5-35 uses generation minus demand minus IES import; 5-49/50 show a different sign on ordinary demand. Re-reading PDF90 confirms 5-46 already contains the next-period ramp multiplier. The remaining audit concerns consistent signs, initial/terminal boundaries and constants in 5-58, not an assertion that the author omitted all intertemporal terms."
adopted = "Build and independently verify the primal clearing LP first. Derive stationarity and strong duality from this exact LP, including prior/next-hour ramp terms, fixed initial output, and terminal index. Do not copy the printed KKT/linearized payment expression wholesale."
remaining = "Price-maker versus price-taker scope, bid bounds and valid complementarity constants must be explicit; no claim that KKT alone linearizes arbitrary bilinear products."
followup = "PDF89: 5-40 limits generator as well as IES energy bids separately from physical capacity. The ordinary-load utility term in 5-34 is constant for fixed ordinary demand; omitting it on both primal and dual sides preserves decisions/prices but changes the reported objective offset."

[[issue]]
id = "R5-M06"
equations = ["5-4", "5-6", "5-7", "5-8", "5-27", "5-34", "5-62"]
pages = [85, 86, 88, 89, 91]
status = "unit_completion"
adopted = "The original clearing description uses one-hour periods. Explicitly multiply energy charges, fuel cost and delivery deviations by dt_h in checked code; capacity prices require their declared per-hour or per-window unit. Equal dt cancels only in the delivery-error ratio, not in monetary or thermal energy accounting."

[[issue]]
id = "R5-M07"
equations = ["5-1", "5-5", "5-62", "5-70"]
pages = [85, 86, 91, 93]
status = "information_scope_required"
adopted = "Day-ahead bids/import/reserve are shared across scenarios. Scenario recourse is explicit two-stage information; this does not prove an online controller can see future daily uncertainty. Cost worst distribution and comfort worst distribution need separate maximization, even with the same ambiguity set."
