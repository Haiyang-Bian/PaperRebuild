[[equation]]
id = "R5-SB1"
source_equations = ["5-71", "5-72", "5-85", "5-86"]
latex = '\min_{o,y,\pi,\mu,\delta,x,z,\theta,\lambda^Q,\nu^Q}\ \Pi^{\mathrm{IES}}(y,\pi,\mu)+\rho\lambda^Q+\sum_j\widehat p_j\nu_j^Q,\quad \lambda^QD_{ij}+\nu_j^Q\ge\theta_i'
meaning = "第一阶段包含连续报价、全部下层KKT和成交到共同承诺的相等关系；净支付只计一次。项目保留完整费用运输对偶，不冻结一次最坏权重。风险运输对偶另行保留。"
api = "build_r5_strategic_benders_master"
test = "R5-SB 市场主问题和声明域"

[[equation]]
id = "R5-SB2"
source_equations = ["5-87至5-92", "5-94至5-98"]
latex = '\theta_i\ge \ell_i^{b,k}(x)-M_i^{b,k}\bigl(1-\chi_b(z_i)\bigr),\qquad \chi_0(z)=1-z,\quad \chi_1(z)=z'
meaning = "已核验原始对偶产生指定舒适分支的补救费用下支撑；M和负费用底界来自全输入有限盒。全部市场报价只通过共同承诺影响补救，因此旧参数LP条件割仍有效；诊断仅在条件LP明确不可行时使用。"
api = "solve_r5_strategic_benders"
test = "R5-SB 条件割与完整候选费用"

[[equation]]
id = "R5-SB3"
source_equations = ["5-93", "5.5.4步骤2.c至2.d"]
latex = 'U_k=\min_{j\le k,\ j\in\mathcal V}\{\Pi_j+\sup_{p\in\mathcal P}\sum_i p_iQ_i(x^j,z_i^j)\},\qquad L_k=\max_{j\le k}L_j^{\mathrm{MP}}'
meaning = "集合V只含市场KKT、所有物理补救和独立费用/风险运输均通过的候选。上界按净支付加最坏补救费选择；完整声明域的主问题原求解器界才可累计。原5-102扩张前的受限域界仅用于该轮受限比较。"
api = "validate_r5_strategic_benders"
test = "R5-SB 风险时间尺度和私人支付"

[[equation]]
id = "R5-SB4"
source_equations = ["5-72", "5-102"]
latex = '\mathcal F_{\mathrm{fixed\ market}}\subseteq\mathcal F_{\mathrm{optimistic}},\qquad \mathcal F_{\Pi^c}=\mathcal F\cap\{z_i=0:i\notin\Pi^c\}'
meaning = "固定互补分支与固定非关键舒适开关是两个独立限制；它们的最优界均不能自动当完整MPEC下界。比较器要求相同输入、相同市场分支及完整舒适域，另列完整模型A2。"
api = "compare_r5_strategic_benders_runs"
test = "R5-SB 证据重读与失败传播"

[[equation]]
id = "R5-SB5"
source_equations = ["5-85至5-92"]
latex = 'v_{\mathrm{MP}}\le v_{\mathrm{full}},\qquad v_{\mathrm{MP}}=-\infty\ \not\Rightarrow\ v_{\mathrm{full}}=-\infty'
meaning = "只有部分补救割的主问题可能比完整模型更松。其无界状态不得改称原策略模型无界，也不能用任意对偶上界或直接参考解掩盖；保留状态并单列适用边界。"
api = "validate_r5_strategic_benders"
test = "R5-SB 本机完整SOS1与独立直接对照"

