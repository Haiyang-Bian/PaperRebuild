pdf_pages = [43,85,86,87,88]
version = "r5_dispatch_checked_v1"
scope = "Given day-ahead awards and one fully known activation trajectory; deterministic physical recourse LP, not bidding or risk optimization."
api = "build_r5_dispatch"
test = "R5 deterministic dispatch hand and reserve signs"

[[equation]]
id = "5-1"
original = '''P^{PCC}_{t\omega}=P^{PCC}_t+P^{PCC,dev}_{t\omega}'''
adopted = "正购电。另定义交付d=P_DA-P_actual；保留原加号，不把两种偏差定义混用。"
[[equation]]
id = "5-2"
original = '''r^R_{t\omega}=\alpha^{R,U}_{t\omega}R^{PCC,U}_t-\alpha^{R,D}_{t\omega}R^{PCC,D}_t'''
adopted = "上备用减少购电，下备用增加购电；本批alpha与成交均为给定数值。"
[[equation]]
id = "5-3"
original = '''P^{mis}_{t\omega}=|r^R_{t\omega}-P^{PCC,dev}_{t\omega}|'''
adopted = "采用|request-d|；非负上图变量有严格正罚价，另验算其是否取等。"
[[equation]]
id = "5-4"
original = '''0\le\sum_tP^{mis}_{t\omega}\le\delta\sum_t(R^{PCC,U}_t+R^{PCC,D}_t)'''
adopted = "两侧乘dt得到MWh；分母是成交容量累计量，不擅自改成实际调用量。"
[[equation]]
id = "5-5"
original = '''\min\ C^{E\&RM}+C^{RT,C}+C^{RT,M}'''
adopted = "固定成交下一条已知轨迹的净费用；不是上层策略优化或随机期望。"
[[equation]]
id = "5-6"
original = '''C^{E\&RM}=\sum_t(\lambda^E_{Mt}P^{PCC}_t-\lambda^{R,U}_tR^{PCC,U}_t-\lambda^{R,D}_tR^{PCC,D}_t)'''
adopted = "分别按USD/MWh与USD/(MW*h)恢复dt；市场价可以为负。"
[[equation]]
id = "5-7"
original = '''C^{RT,C}=\sum_\omega\pi_\omega\sum_t(\sum_{g\in\mathcal G^{CHP}}c_g^{CHP}P^{CHP}_{gt\omega}+\sum_{g\in\mathcal G^{PV}}c_g^{PV}P^{PV}_{gt\omega})'''
adopted = "本批退化为一个情景；按设备显式单位费用计入GT等有成本设备，原式没有单列GT的缺口保留。"
[[equation]]
id = "5-8"
original = '''C^{RT,M}=\sum_\omega\pi_\omega\sum_t(-\lambda^{RT}_{Mt\omega}P^{PCC,dev}_{t\omega}+\lambda^{pen}P^{mis}_{t\omega})'''
adopted = "与正交付d保持一致：-price_RT*d+penalty*abs(request-d)，全部乘dt。"
[[equation]]
id = "5-9"
original = '''\underline P_g^c\le P^c_{gt\omega}\le\overline P_g^c,\quad-\overline Q_g^c\le Q^c_{gt\omega}\le\overline Q_g^c,\quad c\in\{CHP,GT,PV,EB\}'''
adopted = "有功P为发电或EB非负耗电；Q统一为有符号净注入，逐设备有限上下界；PV另有可用轨迹。"
[[equation]]
id = "5-10"
original = '''-RD_g\le P^c_{gt\omega}-P^c_{g,t-1,\omega}\le RU_g,\quad c\in\{CHP,GT\}'''
adopted = "显式初始出力，MW/h爬坡乘dt。"
[[equation]]
id = "5-11"
original = '''H^{CHP}_{gt\omega}=\eta_g^{CHP}P^{CHP}_{gt\omega}'''
adopted = "常热电比，按source_id汇总到非负流量源端口。"
[[equation]]
id = "5-12"
original = '''H^{EB}_{gt\omega}=COP_g^{EB}P^{EB}_{gt\omega}'''
adopted = "EB有功为耗电，电平衡扣除、热平衡增加。"
[[equation]]
id = "5-13"
original = '''P^{PCC}_{t\omega}=\sum_{b:1\to b}P_{1b,t\omega}'''
adopted = "采用根节点守恒；若根节点有本地负荷/设备也计入，原无根负荷特例自动退化为该式。"
[[equation]]
id = "5-14"
original = '''\sum_{g\in\mathcal G_n^{CHP}}P^{CHP}_{gt\omega}+\sum_{g\in\mathcal G_n^{EB}}P^{EB}_{gt\omega}+\sum_{g\in\mathcal G_n^{PV}}P^{PV}_{gt\omega}+P_{mn,t\omega}=\sum_{b:n\to b}P_{nb,t\omega}+P^D_{nt\omega}'''
adopted = "按元件和守恒恢复GT发电，EB及本地加热在耗电端；不复制原EB正供给项。"
[[equation]]
id = "5-15"
original = '''\sum_{g\in\mathcal G_n^{CHP}}Q^{CHP}_{gt\omega}+Q_{mn,t\omega}=\sum_{b:n\to b}Q_{nb,t\omega}+Q^D_{nt\omega}'''
adopted = "按各设备显式Q净注入边界求和；本批合成EB/PV设Q=0，本地加热采用单位功率因数。"
[[equation]]
id = "5-16"
original = '''v_{nt\omega}=v_{mt\omega}-(r_{mn}P_{mn,t\omega}+x_{mn}Q_{mn,t\omega})/v_0'''
adopted = "v为幅值pu，P/Q除S_base_MVA，r/x为pu；损耗忽略，不当作交流支路等式认证。"
[[equation]]
id = "5-17"
original = '''\underline V\le v_{nt\omega}\le\overline V'''
adopted = "根电压固定，逐节点界；另加显式P/Q线路运行盒界，不能称MVA圆形容量。"
[[equation]]
id = "5-18"
original = '''\sum_{g\in\mathcal G_j^{CHP}}H^{CHP}_{gt\omega}+\sum_{g\in\mathcal G_j^{EB}}H^{EB}_{gt\omega}=c_w\hat m_{jt}(\tau^S_{jt\omega}-\tau^R_{jt\omega})'''
adopted = "源端口流量非负；源出温与节点供水混合温度分开。c为J/(kg*K)，热功率除1e6为MW。"
[[equation]]
id = "5-19"
original = '''H^D_{jt\omega}=-c_w\hat m_{jt}(\tau^S_{jt\omega}-\tau^R_{jt\omega})'''
adopted = "负荷端口以非负取水流量表示，H_D=cp*m_load*(S_node-R_load)，不对负流量套正界。"
[[equation]]
id = "5-20"
original = '''\sum_{j:j\to k}\hat m_{jk,t}\tau^{S,out}_{jk,t\omega}+\hat m_{kt}\tau^S_{kt\omega}=(\sum_{j:j\to k}\hat m_{jk,t}+\hat m_{jt})\tau^{S,mix}_{jt\omega}'''
adopted = "原右侧节点下标不一致，采用显式入流焓/总出流混合，见项目R5-D3。"
[[equation]]
id = "5-21"
original = '''\sum_{l:l\to k}\hat m_{kl,t}\tau^{R,out}_{lk,t\omega}+\hat m_{kt}\tau^R_{kt\omega}=(\sum_{l:l\to k}\hat m_{kl,t}+\hat m_{jt})\tau^{R,mix}_{jt\omega}'''
adopted = "保留原印刷下标问题；回水按反向管道入流加负荷出口，独立于供水混合。"
[[equation]]
id = "5-22"
original = '''\tau^{S,in}_{jk,t\omega}=\tau^{S,mix}_{jt\omega},\quad\tau^{R,in}_{kj,t\omega}=\tau^{R,mix}_{kt\omega}'''
adopted = "一对供回水管共用正向供水索引，回水入口取to节点，不互换历史。"
[[equation]]
id = "5-23"
original = '''\tau^S_{jt\omega}=\tau^{S,mix}_{jt\omega}\ (j\in\mathcal J^S),\quad\tau^R_{jt\omega}=\tau^{R,mix}_{jt\omega}\ (j\in\mathcal J^D)'''
adopted = "在源/荷端口与网络混合节点间按实际水流连接；一般源混合节点不能强令源出口等于混合温度。"
[[equation]]
id = "5-24"
original = '''\underline\tau^{S,mix}\le\tau^{S,mix}_{jt\omega}\le\overline\tau^{S,mix},\quad\underline\tau^{R,mix}\le\tau^{R,mix}_{jt\omega}\le\overline\tau^{R,mix}'''
adopted = "节点供回水与端口温度界分别声明。"
[[equation]]
id = "5-25"
original = '''\tau^{S/R,out,*}_{jk,t\omega}=\sum_{\zeta=1}^tK_{jk,t\zeta}\tau^{S/R,in}_{jk,\zeta\omega}+\hat\tau^{S/R,out,*}_{jk,t}'''
adopted = "固定正流量的精确时段质量重叠，非整步两段加权；前窗入口历史显式给定。"
[[equation]]
id = "5-26"
original = '''\tau^{S/R,out}_{jk,t\omega}=\hat\tau_t^{AM}+J_{jk,t}(\tau^{S/R,out,*}_{jk,t\omega}-\hat\tau_t^{AM})'''
adopted = "沿用2-50的作者节点法J，独立验算；不是连续PDE精确衰减，C08适用边界保留。"
[[equation]]
id = "5-27"
original = '''\eta^H H^D_{jt\omega}+U_j(\hat\tau_t^{AM}-\tau^{IN}_{jt\omega})=\tau^{IN}_{jt\omega}-\tau^{IN}_{j,t-1,\omega}'''
adopted = "依据2-72及总热定义改为H_D+H_DH，η=dt/C、U=dt*G/C；项目物理参数显式输入。"
[[equation]]
id = "5-28"
original = '''\underline\tau^{IN}\le\tau^{IN}_{jt\omega}\le\overline\tau^{IN}'''
adopted = "本批硬舒适界，未启用风险开关；初温与free/initial终端规则显式给定。"
[[equation]]
id = "5-29"
original = '''P^D_{jt\omega}=\hat P^D_{jt\omega}+P^{DH}_{jt\omega}'''
adopted = "采用hat P为基础电负荷，本地加热额外耗电；不再把正文所称总电负荷重复计入。"
[[equation]]
id = "5-30"
original = '''H^D_{jt\omega}=\hat H^D_{jt\omega}-H^{DH}_{jt\omega}'''
adopted = "总受热等于区供热加本地热；没有单独固定一个与室温动态不一致的热需求。"
[[equation]]
id = "5-31"
original = '''0\le P^{DH}_{jt\omega}\le\overline P^{DH}_j,\quad H^{DH}_{jt\omega}=\eta^{DH}_jP^{DH}_{jt\omega}'''
adopted = "P_DH额定值明确按电输入MW；合成COP显式提供，不使用原表5-4尚未核清的容量口径。"

