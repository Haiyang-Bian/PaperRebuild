[[issue]]
id="R5-D01"
decision="正交付d=日前-实际；(5-1)加号与(5-3)/(5-8)组合不可混用。手算上下备用与结算检查。"
[[issue]]
id="R5-D02"
decision="2-72使用总热量，5-27采用H_D+H_DH；C/G是项目物理恢复，原系数跨时间步不得直接复用。"
[[issue]]
id="R5-D03"
decision="EB耗电、GT发电与成本恢复；Q统一净注入，本地加热功率因数1。没有存储设备，不擅自加入。"
[[issue]]
id="R5-D04"
decision="固定正流量、显式历史；按关联关系分别混合供回水，不复制5-20/21/23冲突下标。作者J离散近似边界保留。"
[[issue]]
id="R5-D05"
decision="线性幅值配电网不认证AC；P/Q盒界、初温与终端规则是显式补全，不计水压/泵耗。"
[[issue]]
id="R5-D06"
decision="固定成交、完整已知一条轨迹；不称在线控制、策略报价、DRO或概率可靠性。备用考核按成交容量累计量归一化。"
