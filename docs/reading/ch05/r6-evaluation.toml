[[equation]]
id = "R6-E1"
latex = 'e(y)=\max_{b,t}\{0,\underline\tau_b-\tau_{bt}(y),\tau_{bt}(y)-\overline\tau_b\},\qquad \operatorname{lexmin}_{y\in\mathcal Y_{\rm phys}(x,\xi)}\bigl(e(y),C_{\rm RT}(y)\bigr)'
meaning = "独立舒适能力诊断：先试硬舒适费用问题，仅其明确不可行时最小化整日最大越界，再以最小越界加1e-8 K为上限优化费用。最小越界的原对偶绝对差须不超过1e-8 K。该诊断改变操作优先级，不替代机会约束策略；硬舒适不可行而峰值近零时保存状态冲突。"
api = "evaluate_r6_day"
test = "R6-E1"

[[equation]]
id = "R6-E2"
latex = 'C_d=C_{\rm DA}(x,\lambda)+C_{\rm device}(y_d)+C_{\rm settlement}(y_d,\xi_d)+C_{\rm penalty}(y_d,\xi_d),\qquad (x,\lambda)=(x^{\rm train},\lambda^{\rm selected})'
meaning = "冻结核验训练结果的日前成交和所选市场价格。新日不重新优化报价或重出清，日前净支付只计一次；设备/容量/热历史/初末边界共同保持。净支付可为负，不称系统资源成本。训练版本及费用完成标志单列，来源哈希不能替代共同模型字段检查。"
api = "r6_policy_from_training"
test = "R6-E2"

[[equation]]
id = "R6-E3"
latex = 'V_d=\mathbf 1\{e(y_d)>10^{-4}\ {\rm K}\},\qquad U_{0.95}=\operatorname{CPUpper}(n_{\rm violation}+n_{\rm unknown},N)'
meaning = "一个完整日是一个联合事件。实际温度越界与训练开关分开；未完成操作或缺少可信最优性证据标unknown。未知保留在分母且保守上界计为违约，采用既有A5单侧界。运行原值、原始乘子、输入、源码和哈希必须能独立重读；统计界本身不认证遗漏物理机制。"
api = "validate_r6_policy_day"
test = "R6-E3"

[[equation]]
id = "R6-E4"
latex = 'd(\xi,\xi_s)=\sqrt{\frac{1}{2T}\sum_{t=1}^{T}\left[(p_t-p_{st})^2+\left(\frac{a_t-a_{st}}{2}\right)^2\right]},\quad s^*(\xi)=\min\operatorname*{argmin}_s d(\xi,\xi_s),\quad y(\xi)\in\operatorname*{argmin}_{y\in\mathcal Y_{z_{s^*(\xi)}}(x,\xi)}C_{\rm RT}(y)'
meaning = "项目外推r6_support_nearest_v1：整日PV比例与有符号调用使用训练距离，等距按冻结支持顺序最早项。继承该训练代表的z：0为原舒适界，1为共同物理温度界；费用问题失败时不暗中换z或调用诊断。仍用完整未来轨迹，不是在线控制。有限支持风险保证不自动传递到新轨迹；多个最优调度的具体执行由预声明求解器确定并保存，不宣称物理策略唯一。"
api = "r6_support_label"
test = "R6-E4"

