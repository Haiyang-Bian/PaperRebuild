schema = "ch05-market-model-v1"
source = "docs/摘要.pdf"
source_sha256 = "20328e2480e773520c19c378e53365fc944c0bafcfca73071f5d8313d5ee7d91"
pdf_pages = [89, 90]
scope = "Fixed bids, fixed ordinary demand and PTDF clearing LP; not the bilevel or stochastic dispatch."
version = "r5_market_clearing_checked_v1"

[[equation]]
id = "5-34"
meaning = "最小化报价供给成本减消费效用"
original = '''\min\ \sum_{g}o^{GC,E}_{gt}P^{GC}_{gt}-\sum_b o^D_{bt}P^D_{bt}-\sum_i o^{IES,E}_{it}P^{IES}_{it}+\sum_g(o^{GC,RU}_{gt}R^{GC,U}_{gt}+o^{GC,RD}_{gt}R^{GC,D}_{gt})+\sum_i(o^{IES,RU}_{it}R^{IES,U}_{it}+o^{IES,RD}_{it}R^{IES,D}_{it})'''
adopted = "固定普通负荷效用作为常数省略；显式求和全部时段并乘dt_h。该数值不是资源成本。原文主体索引J/l在展示中改记g/b/i。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-35"
meaning = "PTDF线路容量与净注入"
original = '''-\overline P_l\le\sum_b\operatorname{PTDF}_{lb}(P^{GC}_{bt}-P^D_{bt}-P^{IES}_{bt})\le\overline P_l'''
adopted = "按接入节点汇总主体，普通负荷与IES购电为负注入；不采用5-49/50的普通负荷正号。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-36"
meaning = "上、下备用容量分别平衡"
original = '''R_t^{Sys,U/D}=\sum_gR_{gt}^{GC,U/D}+\sum_iR_{it}^{IES,U/D}'''
adopted = "保持等式平衡；备用容量尚不认证激活后的网络与热状态可交付性。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-37"
meaning = "系统能量平衡"
original = '''\sum_b(-P_{bt}^{IES}-P_{bt}^{D}+P_{bt}^{GC})=0'''
adopted = "代码取整行相反数D+IES-GC=0，等式乘子的符号一并转换。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-38"
meaning = "发电机能量与备用共用物理容量"
original = '''\underline P_g^{GC}+R_{gt}^{GC,D}\le P_{gt}^{GC}\le\overline P_g^{GC}-R_{gt}^{GC,U}'''
adopted = "上下容量逐行保留，备用报价上限与物理余量同时生效。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-39"
meaning = "IES上备用减少购电，下备用增加购电"
original = '''\underline P_i^{IES}+R_{it}^{IES,U}\le P_{it}^{IES}\le\overline P_i^{IES}-R_{it}^{IES,D}'''
adopted = "购电为正；本轮只验证日前余量，实时交付符号留待物理补救接口单独验证。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-40"
meaning = "发电机和IES各自的能量报价容量"
original = '''0\le P_{jt}^{GC/IES}\le P_j^{Bid}'''
adopted = "分别使用gen.p_bid_max与ies.purchase_bid_max，不默认为物理容量。"
api = "build_r5_market"
test = "R5 market KKT ramp, integrity and statuses"

[[equation]]
id = "5-41"
meaning = "备用报价容量"
original = '''0\le R_{jt}^{GC/IES,U/D}\le R_j^{Bid}'''
adopted = "为主体和上/下备用分别提供有限非负上限。"
api = "build_r5_market"
test = "R5 market primal, dual and units"

[[equation]]
id = "5-42"
meaning = "发电机跨时段爬坡"
original = '''-R_g^{RP}\le P_{gt}^{GC}-P_{g,t-1}^{GC}\le R_g^{RP}'''
adopted = "显式p_initial与dt_h；可分别指定上/下MW/h边界。末端下一时段乘子置零。"
api = "build_r5_market_dual"
test = "R5 market KKT ramp, integrity and statuses"

