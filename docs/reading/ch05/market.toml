[[issue]]
id = "R5-MK-C01"
decision = "按5-35采用负的普通负荷注入；5-49/50正号保留在原页审计，不复制。"
[[issue]]
id = "R5-MK-C02"
decision = "原5-46已有下一时段项。显式补齐初始出力、时间单位和对偶常数，并测试首末边界；不声称作者漏写全部跨时耦合。"
[[issue]]
id = "R5-MK-C03"
decision = "固定普通负荷效用项是常数，本模型原对偶同时省略；只比较同口径目标。"
[[issue]]
id = "R5-MK-C04"
decision = "发电能量报价上限与物理容量分开；备用报价上限和物理余量也分别约束。"
[[issue]]
id = "R5-MK-C05"
decision = "本批固定报价连续LP不包含策略反馈、备用激活可交付性、IES物理补救或风险；退化价格不要求逐项唯一。"
