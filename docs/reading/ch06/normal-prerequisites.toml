[[original_equation]]
id = "6-6"
pdf_page = 107
latex = '\sum_{t^{\prime}=t-T^{\rm ON}+1}^{t}\nu_{g,t^{\prime}}^{\rm CHP}\le1-u_{g,t}^{\rm CHP}'
note = "按扫描原式保留。ν在上一页被定义为启动；本式启动当期矛盾，不用于主实现。负时间下标还需要显式历史。"
[[original_equation]]
id = "6-7"
pdf_page = 107
latex = '\sum_{t^{\prime}=t-T^{\rm OFF}+1}^{t}\nu_{g,t^{\prime}}^{\rm CHP}\le1-u_{g,t-T^{\rm OFF}}^{\rm CHP}'
note = "按原式保留移位的u下标。本批没有仅凭外形判它必错；转移定义、首末历史与最短停机语义一起通过独立持续时长判据重建。"
[[original_equation]]
id = "6-92"
pdf_page = 117
latex = '\mathcal X=\{x\in\mathbb R^k\times\{0,1\}^m:Ax\le b\}'
note = "原文紧凑正常域。正常详细热网到此形式的固定量或线性化步骤尚未闭合，不用该记号替代实际约束类型检查。"

[[reference]]
id = "PyPSA-UC"
url = "https://docs.pypsa.org/latest/user-guide/optimization/unit-commitment/"
accessed = "2026-09-20"
role = "仅对照最短开停时长、首时段历史与爬坡语义；没有引入Python依赖或照搬其末端规则"

[[equation]]
id = "R7-N1"
source_equations = ["6-1", "6-6", "6-7"]
latex = 'u_t-u_{t-1}=\nu_t^{\rm on}-\nu_t^{\rm off},\quad \nu_t^{\rm on}+\nu_t^{\rm off}\le1,\quad (u_t,\nu_t^{\rm on},\nu_t^{\rm off})\in\{0,1\}^3'
meaning = "启动定义恢复：从0到1才有启动，从1到0才有关停。即使启机费为零也成立。原6-6把启动ν的滑动和限制为1-u，在启动当期要求1≤0，与PDF106的定义矛盾。项目新增关停变量，不把它冒称原文符号。"
classification = "derived_correction_with_literal_counterexample"
api = "add_r7_chp_commitment!"
test = "R7-N1 literal startup contradiction"

[[equation]]
id = "R7-N2"
source_equations = ["6-6", "6-7"]
latex = '\sum_{k=\max(1,t-U+1)}^t\nu_k^{\rm on}\le u_t,\quad \sum_{k=\max(1,t-D+1)}^t\nu_k^{\rm off}\le1-u_t,\quad U=\lceil T^{\rm ON}/\Delta t\rceil,\ D=\lceil T^{\rm OFF}/\Delta t\rceil'
meaning = "启动后U个区间内不能关机，关机后D个区间内不能启动。U或D为零时和式为空。离散动作只发生在区间边界，非整倍小时上取整是这一离散语义的结果；不改变实际最短小时数。验证器逐段计时，与建模侧滑动和式独立。"
classification = "derived_equivalent_dwell_time_formulation"
api = "add_r7_chp_commitment!"
test = "R7-N2 N3 N4 exhaustive dwell-time oracle"

[[equation]]
id = "R7-N3"
source_equations = ["6-6", "6-7"]
latex = 'r_0=\left\lceil\frac{\max(0,T^{u_0}-a_0)}{\Delta t}\right\rceil,\qquad u_t=u_0\ (1\le t\le\min(T,r_0))'
meaning = "a0为窗口前已持续的小时数，T^u0按初始状态选最短开/停时长。首时段不能默认满足历史义务；初始开机出力按同一场景传入。原文没有闭合窗口前历史，本条是项目边界补充。"
classification = "explicit_initial_history_completion"
api = "add_r7_chp_commitment!"
test = "R7-N2 N3 N4 exhaustive dwell-time oracle"

[[equation]]
id = "R7-N4"
source_equations = ["6-6", "6-7"]
latex = 'r_T=\max(0,T^{u_T}-a_T)'
meaning = "carry_obligation允许时域结束时仍有最短开/停义务，并输出rT及末状态；后续窗口必须继承。complete_within_horizon额外要求rT=0。这两种末端规则均为显式项目选择，不能把窗口外时间视为已经运行，也不能从原电池周期条件推断CHP周期启停。"
classification = "project_terminal_boundary_variants"
api = "validate_r7_chp"
test = "R7-N2 N3 N4 exhaustive dwell-time oracle"

[[equation]]
id = "R7-N5"
source_equations = ["6-1", "6-4", "6-5"]
latex = 'C^{\rm CHP}=c^{\rm SU}\sum_t\nu_t^{\rm on}+\Delta t\sum_\omega\pi_\omega\sum_t c^P P_{t,\omega}^{\rm CHP}'
meaning = "设备块只返回CHP的费用表达式。cP按电功率计综合运行费，USD/MWh；启机费USD/次不再乘dt，也不按场景重复收费。原6-1可见项为cCHP*P，接页正文又解释电、热成本，采用口径显式为electric_equivalent，不静默加入未显示的热成本。R为MW/h，正常爬坡乘dt；SU/SD为一次边界允许变化MW。完整PCC/GT/RE/BES目标尚未连接。"
classification = "adopted_cost_basis_and_time_unit_completion"
api = "add_r7_chp_commitment!"
test = "R7-N5 cost, stochastic sharing, ramping and units"

[[equation]]
id = "R7-N6"
source_equations = ["6-56", "6-57", "6-58", "6-59", "6-60"]
latex = 'u^{\rm event}_k=u_{t_s+k-1},\quad P^{\rm before}_\omega=P_{t_s-1,\omega}^{\rm normal}'
meaning = "事件启停来自窗口内正常计划，首区间爬坡从上一正常区间末的同场景出力开始。ts=1使用输入历史。该接口只继承CHP，不认证电池/管温或完整灾前计划；原值哈希、场景顺序、时间步与输入身份同时返回。"
classification = "checked_component_state_handoff"
api = "r7_chp_event_boundary"
test = "R7-N6 inherited CHP event boundary"

[[equation]]
id = "R7-N7"
source_equations = ["6-26", "6-28", "6-33", "6-34", "6-37", "6-38", "6-41", "6-42", "6-92"]
latex = 'H=0.0042m\Delta T,\quad H(1,40)=H(2,20)=0.168,\quad H(1.5,30)=0.189\ne0.168'
meaning = "两个等热功率可行点的中点不满足原等式；数值单位为MW、kg/s、K。原正常热网包含双线性、二次和变流量输运关系，不能仅凭6-92写成Ax≤b就断言其等价为MILP。该反例只说明这些保留等式非线性/非凸，不证明完整正常问题一定不可行。"
classification = "analytic_model_class_counterexample_no_network_implementation"
api = ""
test = "R7-N7 nonlinear normal heat"

[[finding]]
id = "R7-NC01"
location = "PDF106–107，6-1至6-7"
original = "ν被定义为启动指示；6-6右端为1-u，缺少完整ν/u转移及窗口前历史。"
adopted = "N1/N2重建启停逻辑，N3/N4显式历史/末端。保留字面不可行反例；只修复有确定语义依据的部分。"
status = "component_implemented_independent_dwell_time_tests"

[[finding]]
id = "R7-NC02"
location = "PDF109–110、116–117，6-26至6-46、6-89、6-92"
original = "6.2正常热网保留非线性关系；6.3.4明确把6.3.3恢复热网替换为双水箱，随后正常域写成混合整数线性紧凑形式。"
adopted = "记录正常域所需线性化/固定参数条件尚未闭合。下一步保留正常详细网络基准；任何固定流量或双水箱正常规划都须新版本、声明新增假设并回代，不视为论文自动给出的等价模型。"
status = "normal_network_derivation_open_component_work_continues"

[[finding]]
id = "R7-NC03"
location = "PDF116，6-90"
original = "恢复初始热量来自正常管温乘体积，未在本页给出非均匀管温的空间平均定义。"
