schema = "r7-compatible-ports-mapping-v1"
version = "r7_recovery_port_checked_v1"
source_sha256 = "20328e2480e773520c19c378e53365fc944c0bafcfca73071f5d8313d5ee7d91"
pdf_pages = [109,114,115,116]
printed_pages = [92,97,98,99]
scope = "旧双水箱代理的显式温区必要条件、孤岛失供解析下界及规划传播；不是详细热模型，也不是已确认的作者笔误修正"

[[equation]]
id = "R7-C1"
latex = '\begin{aligned}\Delta\tau_{j,\min}^{q,\rm compatible}&=\max\{\Delta\tau_{j,\min}^{q},\tau_{\min}^{S}-\tau_{\max}^{R}\},\\\Delta\tau_{j,\max}^{q,\rm compatible}&=\min\{\Delta\tau_{j,\max}^{q},\tau_{\max}^{S}-\tau_{\min}^{R}\},\\\frac{c_w}{10^6}m_j^q\Delta\tau_{j,\min}^{q,\rm compatible}&\le H_j^q\le\frac{c_w}{10^6}m_j^q\Delta\tau_{j,\max}^{q,\rm compatible},\quad q\in\{\mathrm{src},\mathrm{load}\}.\end{aligned}'
meaning = "源、荷端口均采用非负流。原6-83/84包络保留，新增供回温区投影。当前合成温区给出10至50K；与原包络取交集。正流交集为空则只能关闭该端口，不改输入界或静默删约束。此条件没有描述温度的位置和输运。"
source_equations = ["6-26:29", "6-81:84", "project global temperature-box interpretation"]
classification = "project strengthening under declared common temperature intervals"
api = "r7_port_temperature_bounds"
test = "R7-C1 versioned interval projection"

[[equation]]
id = "R7-C2"
latex = '\left[\forall j:H_j^{\rm src}=0,\ \Delta\tau_{j,\min}^{\rm src,compatible}>0\right]\Rightarrow\sum_jm_j^{\rm src}=\sum_jm_j^{\rm load}=0\Rightarrow H_j^{\rm delivered}=0\Rightarrow L_H\ge\sum_\omega\pi_\omega\sum_{j,t}H_{j,t}^{D}\Delta t'
meaning = "本采用无损电网里，无任何有功消纳端的电孤岛使其非负发电总和为零。若全部热源均被这一关系限制，源端口正温差使源流为零，再由质量守恒、非负荷流与有限温差迫使全部热失供。存在微小正电负荷、可充电电池或电锅炉时，该接口保守拒绝证书，不以数值容差将它们忽略。"
source_equations = ["6-11", "6-19", "6-26", "6-73", "6-83:84"]
classification = "derived necessary loss bound in adopted linear-electric compatible-port domain"
api = "r7_island_heat_bound"
test = "R7-C2 bound, counterexamples and independent values"

[[equation]]
id = "R7-C3"
latex = '\exists s,\gamma\in\mathcal U_s:\quad\underline L_H(s,\gamma)>\overline L_s\quad\Longrightarrow\quad\nexists x\ \text{satisfying all declared resilience constraints}'
meaning = "只有当解析下界独立于允许的灾前状态、且设备与潜在恢复电网保持不变时，才能推广为规划不可行。当前单源断线例的热失供必要下界0.4MWh已经超过原零门槛。另设0.4MWh的规划仅是诊断对照，不把放宽目标当作原问题修复。"
source_equations = ["6-52:53", "R7-C2", "project synthetic single-source cut"]
classification = "conditional planning impossibility proof, not a global physical claim"
api = "with_r7_port_temperature_bounds"
test = "R7-C3 planning domain and common event propagation"

[[finding]]
id = "R7-C-Q01"
original = "6-27按热源节点给供温范围，没有写乘以启停变量或零产热时豁免。6-73:90简化后用端口温差包络和全网储热代替具体温度。"
adopted = "本批保留原合成输入的温区，显式新增port_checked版本；此前原项目包络0至80K/0至60K比温区相容的10至50K更宽。首先是项目采用模型的内部相容性问题，不能直接认定作者原参数也有这一错误。"
status = "original pages checked; no silent off-source exemption"

[[finding]]
id = "R7-C-Q02"
original = "管内热量可能在没有新产热时释放，但是否能循环取热仍依赖实际端口温区、空间输运和泵/旁通条件。"
adopted = "不把本输入的无热交付证明扩展为所有储热均无价值。若允许停机循环降温或加入旁通，须显式建立新边界与设备模型；本批没有实现该改动，也没有为通过而调整温区。"
status = "alternative operating interpretation remains a separate research question"

