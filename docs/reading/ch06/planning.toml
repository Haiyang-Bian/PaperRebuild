[[original_equation]]
id = "6-93"
pdf_page = 117
latex = '\max_{\gamma^s\in\mathcal U}\min_{(r^s,z^s)\in\mathcal Y(x,\gamma^s)} f^{\mathsf T}r^s\leq L,\quad\forall s'
note = "每个事件下的最坏故障，其最佳恢复损失仍不得超过门槛。无可行恢复时采用扩展值+∞，不能把缺少损失值填成零。"
[[original_equation]]
id = "6-100"
pdf_page = 118
latex = '\min_x c^{\mathsf T}x'
note = "目标只有正常费用；恢复块提供满足门槛的见证。灾后损失不是额外加入本目标的费用项。"
[[original_equation]]
id = "6-102"
pdf_page = 118
latex = 'f^{\mathsf T}r_\nu^s\leq L,\quad 1\leq\nu\leq l,\ \forall s'
note = "有限已加入故障的失供阈值，每个故障有独立恢复变量。"
[[original_equation]]
id = "6-103"
pdf_page = 118
latex = 'Fx+H\gamma_\nu^{s*}+Kr_\nu^s+Jz_\nu^s\leq g,\quad1\leq\nu\leq l,\ \forall s'
note = "所有恢复块必须链接本轮同一个正常决策x；不能绑定到上一轮常量计划。"

[[equation]]
id = "R7-M1"
latex = '\min_{x\in\mathcal X_{\bar m}} C(x)\quad\text{s.t.}\quad\exists y_{s,\gamma}\in\mathcal Y_s(x,\gamma):\ell_s(y_{s,\gamma})\leq L_s,\quad (s,\gamma)\in\mathcal A_k'
meaning = "给定管流的采用域X_m中，每个已加入事件/故障有独立恢复见证。取全部故障为全量参考，空集合为经济初始主问题。暴露CHP启停、前步功率、电池E[t_s]、整管供回库存和正常管流，再链接同一正常变量。恢复块只提供存在性，不伪造最小失供界。"
source_equations = ["6-91", "6-92", "6-97", "6-98", "6-99", "6-100", "6-101", "6-102", "6-103", "6-104"]
classification = "conditional_domain_and_explicit_boundary_link"
api = "build_r7_planning"
test = "R7-M1 shared normal variables and exact affine blocks"
[[equation]]
id = "R7-M2"
latex = 'C_0=20(1.6)+100(3.2-1.6)=192,\quad C_{\rm safe}\geq C_0+2\sum_\omega\pi_\omega(0.8-E_{0,\omega})=193.275'
meaning = "独立合成reserve-hand的解析下界，USD。4小时无损周期总热量固定CHP总电量1.6MWh，故PCC购电1.6MWh。断线时负荷节点由电池独立供0.8MWh，每种正常场景至少提前充至0.8，随后正常周期回到0.2/0.15。两个事件是不同可能灾害，同一正常计划可持有储备，不将补能算两次。达到该下界还须热、电和模式共同可行。"
source_equations = ["6-1", "6-12", "6-14", "6-15", "6-93"]
classification = "project_synthetic_analytic_benchmark"
api = "solve_r7_planning"
test = "R7-M2 analytical reserve cost and extensive reference"
[[equation]]
id = "R7-M3"
latex = '\max_\gamma\underline q_s(x,\gamma)\leq W_s(x)\leq\max_\gamma\overline q_s(x,\gamma),\qquad W_s(x)=\max_\gamma\min_y\ell_s(y)'
meaning = "固定故障最小化的有效界向最坏故障传播。合格恢复原值给该故障上界；故障未尝试或无候选时其上界为+∞。单故障下界超过门槛即可认证反例；所有故障上界合格才认证事件。每次x改变，全部事件证书重新计算并绑定父ID/原值哈希。"
source_equations = ["6-93", "6-96", "6-105", "6-106", "6-107"]
classification = "bound_direction_and_certificate_scope"
api = "validate_r7_planning"
test = "R7-M3 event certificates reset and bound directions"
[[equation]]
id = "R7-M4"
latex = '\mathcal Y_s(x,\gamma)=\varnothing\Rightarrow q_s(x,\gamma)=+\infty;\qquad\mathcal X_{\bar m}\cap\mathcal F(\mathcal A_k)=\varnothing\Rightarrow\mathcal X_{\bar m}\cap\mathcal F(\mathcal U)=\varnothing'
meaning = "已认证不可行恢复不是有限损失；已加入故障的主问题不可行可以排除全故障规划。求解错误、缺许可、限时无解仍是未决，不能用此蕴含关系。旧normal-hand的孤岛CHP冲突与热量容量证明继续保留。"
source_equations = ["6-95", "6-97", "6-102", "6-103"]
classification = "infeasible_recourse_and_master_implication"
api = "solve_r7_planning"
test = "R7-M4 infeasible inherited CHP and failure evidence"
[[equation]]
id = "R7-M5"
latex = '\underline C_k\leq C_{\rm robust}^*\leq C(\hat x),\quad\hat x\text{通过全部事件/故障验证}'
meaning = "部分故障主问题的有效费用下界可用于本条件安全规划；安全候选费用给上界。两者按既有A2核对。该下界不属于无灾害正常模型，不能放进正常子记录或混作MWh失供界。原值、界、来源与每轮证书一同封存重验。"
source_equations = ["6-100", "6-101", "6-102", "6-103", "6-104"]
classification = "objective_scope_and_immutable_evidence"
api = "save_r7_planning"
test = "R7-M5 immutable evidence and independent revalidation"

[[finding]]
id = "MP01"
original = "6-92将正常域写成紧凑MILP；原正常温度、水力、变流量输运含非线性。"
adopted = "仅X_m给定正管流、固定正常电拓扑时采用标量仿射/整数主问题；实际检查全部JuMP约束类型，不证明原完整正常域线性。"
status = "conditional_domain_implemented_full_domain_open"
[[finding]]
id = "MP02"
original = "PDF118在事件通过时置I_s=1，却随后以所有I_s=0作为终止条件。"
adopted = "沿已有Q06按同一x所有事件均通过才停；每轮重置标志，故障下界与可行上界分别记录。本有限故障版本把本轮发现的所有认证反例一起加入，属于项目批量加约束规则；原文描述按事件加入最坏故障，不宣称完全相同的迭代轨迹。"
status = "documented_logic_correction"
[[finding]]
id = "MP03"
original = "PDF119提出内层对偶重构与上下界迭代；字面符号/界更新及有限乘子范围尚需闭合。"
adopted = "本批先用有限故障完整MILP审计和全部恢复块参考验证外层，不设任意对偶Big-M、不把穷举称作者完整嵌套算法。恢复存在硬不可行时不能默认完全补救；强对偶及不可行射线路线另行推导。"
status = "inner_dual_algorithm_open"
[[finding]]
id = "MP04"
original = "原6-97至6-99讨论存在满足门槛的恢复解。"
adopted = "主问题恢复块不优化失供，只要求可行且不超门槛；保存witness_loss及明确目标类型。认证最坏损失另外运行固定故障最小化。"
status = "existential_witness_implemented"

