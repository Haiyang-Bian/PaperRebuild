[[original_equation]]
id = "6-105"
pdf_page = 119
latex = '\theta(x^*,\gamma^*)=\min_{(r,z)\in\mathcal Y(x^*,\gamma^*)}f^{\mathsf T}r'
note = "固定故障后最小化恢复失供；不可行采用扩展值+∞。"
[[original_equation]]
id = "6-106"
pdf_page = 119
latex = '\overline\Theta=\max f^{\mathsf T}r_0'
note = "受限恢复模式的对手主问题最大化；有效求解器界是最坏损失上界。"
[[original_equation]]
id = "6-107"
pdf_page = 119
latex = 'G\gamma\geq E'
note = "本页右侧为E，其他紧凑式记号不完全一致；代码直接用线路脆弱标志与故障数量预算。"
[[original_equation]]
id = "6-108"
pdf_page = 119
latex = 'Fx^*+H\gamma+Kr_0+Jz_0\leq g'
note = "同时要求候选故障存在恢复见证。若模型允许某个故障完全无恢复，该式会将其排除；不能直接套用到已证实存在硬不可行的采用模型。"
[[original_equation]]
id = "6-109"
pdf_page = 119
latex = 'f^{\mathsf T}r_0\leq(g-Fx^*-H\gamma-Jz_q^*)^{\mathsf T}\pi_q,\quad 1\leq q\leq o'
note = "使用已发现恢复拓扑的对偶约束限制对手。原文对偶符号须与6-108及恢复变量域联合检查；本实现从全部实际LP行重新推导。"
[[original_equation]]
id = "6-110"
pdf_page = 119
latex = 'K^{\mathsf T}\pi_q\geq f,\quad1\leq q\leq o'
note = "不能直接用于自由变量、≤行的最小化LP。采用版将变量界显式列为行，平稳性为等式。"
[[original_equation]]
id = "6-111"
pdf_page = 119
latex = '\pi_q\in\mathbb R_+^n,\ z_q\in\{0,1\}^p,\quad1\leq q\leq o'
note = "文中z_q*是已发现拓扑。项目λ采用≤0约定，不靠修改原始乘子令其通过。"

[[equation]]
id = "R7-I1"
latex = 'q_z(\gamma)=\min_{r\in\mathbb R^n}\{c^{\mathsf T}r: A_zr\leq b_z+D_z\gamma\},\qquad q_z(\gamma)=\sup_{\lambda\leq0,\ A_z^{\mathsf T}\lambda=c}(b_z+D_z\gamma)^{\mathsf T}\lambda'
meaning = "将实际标量仿射行、变量上下界和固定值全部抽取；等式拆为两侧，恢复变量本身自由。给定灾前状态及拓扑，故障只进入右侧。可行有界LP用强对偶；不可行且对偶可行时取+∞。"
source_equations = ["6-105", "6-108", "6-109", "6-110", "6-111"]
classification = "derived_from_actual_primal_rows"
api = "r7_recovery_lp"
test = "R7-I1-row-extraction"
[[equation]]
id = "R7-I2"
latex = 'c_j>0,\ -r_j\leq0\ \Longrightarrow\ \lambda_{i(j)}=-c_j,\quad \lambda_i=0\ (i\notin\{i(j)\})'
meaning = "失供目标只有非负系数，每个有费用变量有显式零下界，因此上述λ对所有故障同时满足Aᵀλ=c、λ≤0。该事实让不可行恢复具有对偶无界方向，不能默认所有固定拓扑都可行。抽取时拒绝不满足此条件的目标。"
source_equations = ["6-105", "6-109"]
classification = "common_dual_feasibility_certificate"
api = "validate_r7_dual"
test = "R7-I2-free-variables-and-common-seed"
[[equation]]
id = "R7-I3"
latex = 'B=\Delta t\sum_{t,\omega}\pi_\omega\left(\sum_n\bar\alpha_nP_{n,t}^d+\sum_j\bar\alpha_j^hH_{j,t}^d\right),\quad C=B+1\ {\rm MWh},\qquad \overline W_Z^C=\max_{\gamma\in\mathcal U}\min\{C,\min_{z\in Z}q_z(\gamma)\}'
meaning = "B是任一可行恢复的失供积分上界；C只是对手认证截断，不是物理损失或乘子边界。有限模式池给完整最坏损失的上包络：若有效主问题上界低于C，则原最坏损失不超过它；若饱和，原问题上界保持∞，由完整恢复判断缺模式还是实际不可行。空池初值为C。"
source_equations = ["6-93", "6-105", "6-106", "6-108", "6-109"]
classification = "project_capped_oracle_for_infeasible_recourse"
api = "r7_recovery_loss_cap"
test = "R7-I3-finite-cap-not-dual-M"
[[equation]]
id = "R7-I4"
latex = '\gamma_l=0\Rightarrow w_{qil}=0,\qquad\gamma_l=1\Rightarrow w_{qil}=\lambda_{qi},\qquad\theta\leq b_q^{\mathsf T}\lambda_q+\sum_{i,l}D_{qil}w_{qil}'
meaning = "二值故障乘子乘积采用原生指示等式，关闭自动桥接且没有项目选择的乘子大M。求解器内部表示仍受数值容差影响，必须检查原始乘子、指示乘积、完整恢复原值和有效界。不适用于某故障的模式留在行系统中，不在零故障下先过滤掉。"
source_equations = ["6-109"]
classification = "native_indicator_reformulation"
api = "build_r7_adversary"
test = "R7-I4-fault-dependent-topology-domain"
[[equation]]
id = "R7-I5"
latex = '\max_{\gamma\ {m checked}}\underline q(\gamma)\leq W,\qquad W\leq\overline W_Z^C\quad\text{仅当已认证 }\overline W_Z^C<C'
meaning = "固定故障完整恢复的有效最小化下界给W下界；对手最大化的有效界给未截断上界。不能把受限对手可行目标当完整恢复最优值。预算、重复模式未闭合、无许可与不支持原生指示保持未决；认证恢复不可行另给∞反例。"
source_equations = ["6-93", "6-105", "6-106"]
classification = "corrected_bound_direction_and_failure_semantics"
api = "solve_r7_adversary"
test = "R7-I5-budget-and-unsupported-native"

